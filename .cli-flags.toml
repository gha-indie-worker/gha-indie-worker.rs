# flags-2-env canonical configuration; see github.com/flags-2-env/flags-2-env.
# flags-2-env reads .cli-flags.toml (not .cli-args.toml).
[flags.core-perf]
env = "ORES_CORE_PERF"
aliases = ["core-perf"]
type = "bool"
default = "false"
help = "Record bounded, allocation-free core timing phases; dump JSONL to stderr on exit."

[flags.core-debug]
env = "ORES_CORE_DEBUG"
aliases = ["core-debug"]
type = "bool"
default = "false"
help = "Record bounded core-only numeric diagnostic events; dump JSONL to stderr on exit."
