name: admission classifier

on:
  pull_request:
    paths:
      - src/admission.rs
      - src/admission_formal.rs
      - src/main.rs
      - .github/workflows/admission-classifier.yml
  push:
    branches: [main]
    paths:
      - src/admission.rs
      - src/admission_formal.rs
      - src/main.rs
      - .github/workflows/admission-classifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-classifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: |
          rustfmt --edition 2021 --check \
            src/admission.rs \
            src/admission_formal.rs
      - name: Compile and run the dependency-free classifier contract
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings \
            src/admission.rs \
            -o "${RUNNER_TEMP}/admission-classifier-tests"
          "${RUNNER_TEMP}/admission-classifier-tests"
      - name: Exhaustively verify all bounded evidence states
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings \
            src/admission_formal.rs \
            -o "${RUNNER_TEMP}/admission-classifier-formal-tests"
          "${RUNNER_TEMP}/admission-classifier-formal-tests"

  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/admission-classifier.yml
      - name: Verify pure classifier and bounded-model inventory
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          classifier = Path("src/admission.rs").read_text(encoding="utf-8")
          model = Path("src/admission_formal.rs").read_text(encoding="utf-8")
          workflow = Path(
              ".github/workflows/admission-classifier.yml"
          ).read_text(encoding="utf-8")

          for token in (
              "zero-step or missing-runner evidence alone is ambiguous; fail closed",
              "PlatformDiagnosticSource::CheckRunAnnotation",
              "PlatformDiagnosticSource::AuthorizedActionsApi",
              "if steps_started",
          ):
              assert token in classifier, token

          for forbidden in (
              "std::fs",
              "std::process",
              "Command::",
              "reqwest",
              "octocrab",
              "unsafe {",
          ):
              assert forbidden not in classifier, forbidden

          for token in (
              "all_756_valid_evidence_states",
              "all_108_conflicting_diagnostic_states",
              "malformed_provider_references_never_authorize_fallback",
              "assert!(!result.fallback_allowed)",
          ):
              assert token in model, token

          for required_job in ("  rust:\n", "  provenance:\n", "  gitleaks:\n"):
              assert required_job in workflow, required_job
          PY
          sha256sum \
            src/admission.rs \
            src/admission_formal.rs \
            .github/workflows/admission-classifier.yml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Scan committed history and proposed changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
