name: Check Run exact recovery reference
on:
  pull_request:
    paths:
      - 'src/check_run_recovery_contract.rs'
      - '.github/workflows/check-run-recovery-contract.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  source-free-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Execute standalone no-token Rust recovery regression oracle
        run: |
          rustc --edition=2021 --test src/check_run_recovery_contract.rs -o "$RUNNER_TEMP/check-recovery-tests"
          "$RUNNER_TEMP/check-recovery-tests" --nocapture
