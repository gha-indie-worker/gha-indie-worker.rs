name: concurrency-contract-verified

on:
  push:
    branches:
      - integration/concurrency-contract-20261006
  workflow_dispatch:

jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Clean compile
        run: mvn -B -Dores.runtime.carriers=java -DskipTests test-compile
      - name: Runtime proof
        run: mvn -B -Dores.runtime.carriers=java -Dtest=OresVMTest,OresSchedulerTest,ChannelRuntimeTest,ChannelSelectSyntaxTest test
      - name: Actor and security proof
        run: mvn -B -Dores.runtime.carriers=java -Dtest=ActorEventBusTest,HungryActorTest,ActorStructuredCancellationTest,UntrustedActorTest,ConcurrencyContractProofTest test
