name: DEN-1862 rustfmt autofix

on:
  push:
    branches:
      - den-1862-log-sidecar-fanout

permissions:
  contents: write

concurrency:
  group: den-1862-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'gha-indie-worker/gha-indie-worker.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-1862-log-sidecar-fanout
          persist-credentials: true
          fetch-depth: 0

      - name: Format only DEN-1862 Rust sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 src/log_sidecar.rs src/exec.rs src/main.rs
          if git diff --quiet -- src/log_sidecar.rs src/exec.rs src/main.rs; then
            echo 'DEN-1862 sources already formatted.'
            exit 0
          fi
          git diff --check -- src/log_sidecar.rs src/exec.rs src/main.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/log_sidecar.rs src/exec.rs src/main.rs
          git commit -m 'DEN-1862 apply rustfmt to log sidecar fanout'
          git push origin HEAD:den-1862-log-sidecar-fanout
