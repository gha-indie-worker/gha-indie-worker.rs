name: Mixed-OS fleet inventory contract
on:
  pull_request:
    paths: [".github/workflows/fleet-inventory-contract.yml", "ops/fleet/inventory-v1.schema.json", "tools/validate_fleet_inventory.py"]
  push:
    branches: [dev, main]
    paths: [".github/workflows/fleet-inventory-contract.yml", "ops/fleet/inventory-v1.schema.json", "tools/validate_fleet_inventory.py"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: python -m json.tool ops/fleet/inventory-v1.schema.json >/dev/null
      - run: python tools/validate_fleet_inventory.py --self-test
      - run: python -m py_compile tools/validate_fleet_inventory.py
