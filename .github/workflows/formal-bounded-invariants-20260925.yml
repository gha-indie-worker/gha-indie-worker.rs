name: Formal bounded deployment invariants

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-deployment-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Format proof harness
        run: rustfmt --edition 2021 --check conformance/formal_bounded_deployment.rs
      - name: Compile proof harness with warnings denied
        run: rustc --edition 2021 -D warnings conformance/formal_bounded_deployment.rs -o /tmp/formal-bounded-deployment
      - name: Execute proof twice deterministically
        run: |
          set -euo pipefail
          /tmp/formal-bounded-deployment | tee /tmp/a
          /tmp/formal-bounded-deployment > /tmp/b
          cmp /tmp/a /tmp/b
