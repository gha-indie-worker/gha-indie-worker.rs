name: Formal Wave 6
on:
  pull_request:
  push:
    branches: [formal/multi-method-wave6-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static proof-harness audit
        run: |
          set -euo pipefail
          python3 -m py_compile conformance/formal_wave6_model.py
          python3 - <<'PY'
          import ast, pathlib
          tree=ast.parse(pathlib.Path('conformance/formal_wave6_model.py').read_text()); assert any(isinstance(n,ast.Assert) for n in ast.walk(tree))
          banned={'eval','exec','compile','__import__','open'}; imports={'os','subprocess','socket','urllib','http','requests','shutil','tempfile'}
          for n in ast.walk(tree):
            if isinstance(n,ast.Call) and isinstance(n.func,ast.Name): assert n.func.id not in banned, n.func.id
            if isinstance(n,(ast.Import,ast.ImportFrom)):
              xs=[a.name.split('.')[0] for a in n.names] if isinstance(n,ast.Import) else [(n.module or '').split('.')[0]]; assert not set(xs)&imports, xs
          PY
      - name: Execute proof twice deterministically
        run: |
          set -euo pipefail
          python3 -I conformance/formal_wave6_model.py | tee /tmp/a
          python3 -I conformance/formal_wave6_model.py > /tmp/b
          cmp /tmp/a /tmp/b
