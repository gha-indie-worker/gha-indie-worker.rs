name: Format standalone worker source once

on:
  push:
    branches:
      - agent/add-standalone-integrity-ci-20260808
    paths:
      - .github/workflows/format-standalone-worker-once.yml

permissions:
  contents: write

concurrency:
  group: format-standalone-worker-once
  cancel-in-progress: false

jobs:
  format-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/add-standalone-integrity-ci-20260808
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install reviewed Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt

      - name: Format every checked-in Rust source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' rust_files < <(find src generated -type f -name '*.rs' -print0 | sort -z)
          test "${#rust_files[@]}" -gt 0
          rustfmt --edition 2021 "${rust_files[@]}"
          rustfmt --edition 2021 --check "${rust_files[@]}"

          python3 <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if not changed:
              raise SystemExit('formatter produced no durable source changes')
          invalid = [
              path for path in changed
              if not path.endswith('.rs')
              or not (path.startswith('src/') or path.startswith('generated/'))
          ]
          if invalid:
              raise SystemExit(f'unexpected formatter changes: {invalid}')
          PY
          git diff --check

      - name: Commit formatted sources and remove this applicator
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/format-standalone-worker-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src generated
          git diff --cached --check
          git commit -m 'style: format standalone worker sources'
          git push origin HEAD:agent/add-standalone-integrity-ci-20260808
