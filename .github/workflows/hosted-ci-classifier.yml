name: hosted CI classifier

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-classifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install pinned Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Check classifier formatting
        run: rustfmt --edition 2021 --check src/hosted_ci.rs
      - name: Compile and execute dependency-free classifier tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src/hosted_ci.rs -o "${RUNNER_TEMP}/hosted-ci-tests"
          "${RUNNER_TEMP}/hosted-ci-tests"

  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Verify exact candidate and pure-classifier boundary
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/hosted_ci.rs').read_text(encoding='utf-8')
          main = Path('src/main.rs').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/hosted-ci-classifier.yml').read_text(encoding='utf-8')

          required = (
              'ZeroStepRunnerAdmissionFailure',
              'ZeroStepUnknown',
              'RunnerAdmissionHint',
              'self.step_count.unwrap_or(0) > 0',
              'self.admission_hint.is_some()',
              'zero_step_success_is_not_accepted_as_green',
              'stepful_failure_stays_source_failure_even_with_admission_hint',
          )
          for token in required:
              assert token in source, token

          for forbidden in (
              'std::fs', 'std::process', 'Command::', 'reqwest', 'octocrab',
              'unsafe {', 'contains("billing")', 'contains("quota")',
          ):
              assert forbidden not in source, forbidden

          assert 'mod hosted_ci;' in main
          for job in ('  rust:\n', '  provenance:\n', '  gitleaks:\n'):
              assert job in workflow, job
          PY
          sha256sum src/hosted_ci.rs src/main.rs .github/workflows/hosted-ci-classifier.yml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
          submodules: false
      - name: Verify exact checkout and complete history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 5 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan exact candidate history and all changed tree files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scan_head="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$scan_head" = "$PR_HEAD_SHA"
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            git cat-file -e "${PR_HEAD_SHA}^{commit}"
            comparison_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          elif [[ "$EVENT_NAME" == 'push' && -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" =~ ^[a-f0-9]{40}$ && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            [[ "$CURRENT_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$scan_head" = "$CURRENT_SHA"
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            comparison_base="$PUSH_BEFORE_SHA"
          else
            # For manual dispatch or a new branch, require a real parent instead
            # of silently falling back to a partial or zero-commit scan.
            [[ "$CURRENT_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$scan_head" = "$CURRENT_SHA"
            comparison_base="$(git rev-parse 'HEAD^')"
          fi
          git cat-file -e "${comparison_base}^{commit}"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --log-opts="${comparison_base}..${scan_head}" .
          # A full-tree Gitleaks scan can reclassify untouched Cargo.lock crate
          # names as generic keys. Scan each final added/modified/renamed file
          # and all new commits instead. Never suppress a finding in changed files.
          changed_file_list="$RUNNER_TEMP/changed-files.nul"
          git diff --name-only -z --diff-filter=ACMR \
            "$comparison_base" "$scan_head" -- > "$changed_file_list"
          test -s "$changed_file_list"
          scan_dir="$RUNNER_TEMP/exact-head-changed-files"
          mkdir -p "$scan_dir"
          source_root="$(pwd -P)"
          count=0
          total_bytes=0
          while IFS= read -r -d '' path; do
            case "$path" in
              /*|../*|*/../*|*/..|./*|*/./*) echo 'unsafe changed path' >&2; exit 1 ;;
            esac
            test -f "$path" && test ! -L "$path"
            # Prevent a tracked-looking path with a symlinked parent from
            # reading outside the candidate checkout.
            resolved="$(realpath -e -- "$path")"
            [[ "$resolved" == "$source_root/"* ]] || {
              echo 'changed file resolves outside checkout' >&2; exit 1;
            }
            bytes="$(stat -c '%s' -- "$path")"
            (( bytes <= 33554432 )) || { echo 'changed file too large' >&2; exit 1; }
            total_bytes=$((total_bytes+bytes))
            (( total_bytes <= 268435456 )) || { echo 'changed scan too large' >&2; exit 1; }
            mkdir -p -- "$scan_dir/$(dirname -- "$path")"
            cp -- "$path" "$scan_dir/$path"
            count=$((count+1))
          done < "$changed_file_list"
          test "$count" -ge 1 && test "$count" -le 10000
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner "$scan_dir"
          echo "Secret scan complete: exact head, $count changed files, complete PR commit range."
