name: hosted CI classifier

# These three contexts are required for every pull request. Path filters
# would leave unrelated PRs with permanently "expected" checks. The rust
# job fails closed on changes it cannot substantively test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-classifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
          fetch-depth: 0
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Fail closed on PR changes outside material test scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --name-only -z "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/ci-changed-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              src/hosted_ci.rs|.github/workflows/hosted-ci-classifier.yml|.github/workflows/github-readiness-audit.yml|scripts/github_readiness_audit.py|tests/test_github_readiness_audit.py|docs/github-readiness-audit.md|generated/README.md)
                ;;
              *)
                echo "::error::${path} is outside this workflow's tested scope; require separate real build/security checks before merge."
                exit 1
                ;;
            esac
          done < "${RUNNER_TEMP}/ci-changed-paths"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Check classifier formatting
        run: rustfmt --edition 2021 --check src/hosted_ci.rs
      - name: Compile and execute dependency-free classifier tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src/hosted_ci.rs -o "${RUNNER_TEMP}/hosted-ci-tests"
          "${RUNNER_TEMP}/hosted-ci-tests"
      - name: Run standalone GitHub readiness audit tests if included
        shell: bash
        run: |
          set -euo pipefail
          if [ -e scripts/github_readiness_audit.py ] || [ -e tests/test_github_readiness_audit.py ]; then
            test -f scripts/github_readiness_audit.py
            test -f tests/test_github_readiness_audit.py
            python3 -m unittest -v tests/test_github_readiness_audit.py
            python3 -m py_compile scripts/github_readiness_audit.py tests/test_github_readiness_audit.py
          fi
      - name: Validate frozen generated-file policy if included
        shell: bash
        run: |
          set -euo pipefail
          if [ -e generated/README.md ]; then
            test -f generated/README.md
            test ! -L generated/README.md
            grep -Fq 'Do **not** hand-edit' generated/README.md
            grep -Fq 'Git does **not** persist the write bit' generated/README.md
          fi

  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Verify exact candidate and pure-classifier boundary
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/hosted_ci.rs').read_text(encoding='utf-8')
          main = Path('src/main.rs').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/hosted-ci-classifier.yml').read_text(encoding='utf-8')

          required = (
              'ZeroStepRunnerAdmissionFailure',
              'ZeroStepUnknown',
              'RunnerAdmissionHint',
              'self.step_count.unwrap_or(0) > 0',
              'self.admission_hint.is_some()',
              'zero_step_success_is_not_accepted_as_green',
              'stepful_failure_stays_source_failure_even_with_admission_hint',
          )
          for token in required:
              assert token in source, token

          for forbidden in (
              'std::fs', 'std::process', 'Command::', 'reqwest', 'octocrab',
              'unsafe {', 'contains("billing")', 'contains("quota")',
          ):
              assert forbidden not in source, forbidden

          assert 'mod hosted_ci;' in main
          for job in ('  rust:\n', '  provenance:\n', '  gitleaks:\n'):
              assert job in workflow, job
          # Required checks must run on *all* PR paths. Runtime changes remain
          # blocked by rust's explicit source-scope guard.
          assert '  pull_request:\n' in workflow
          assert '    paths:\n' not in workflow
          assert 'Fail closed on PR changes outside material test scope' in workflow
          PY
          sha256sum src/hosted_ci.rs src/main.rs .github/workflows/hosted-ci-classifier.yml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Reject credential-shaped material in tracked source without disclosing matches
        shell: bash
        run: |
          set -euo pipefail
          # A conservative credential-pattern guard, not a claim that a full
          # independent gitleaks scan or runtime audit has been performed.
          if git grep -I -q -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- .; then
            echo 'credential-shaped material is forbidden' >&2
            exit 1
          fi
          git diff --check
