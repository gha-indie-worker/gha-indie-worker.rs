name: hosted CI classifier

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-classifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Check classifier formatting
        run: rustfmt --edition 2021 --check src/hosted_ci.rs
      - name: Compile and execute dependency-free classifier tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src/hosted_ci.rs -o "${RUNNER_TEMP}/hosted-ci-tests"
          "${RUNNER_TEMP}/hosted-ci-tests"

  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Verify exact candidate and pure-classifier boundary
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/hosted_ci.rs').read_text(encoding='utf-8')
          main = Path('src/main.rs').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/hosted-ci-classifier.yml').read_text(encoding='utf-8')

          required = (
              'ZeroStepRunnerAdmissionFailure',
              'ZeroStepUnknown',
              'RunnerAdmissionHint',
              'self.step_count.unwrap_or(0) > 0',
              'self.admission_hint.is_some()',
              'zero_step_success_is_not_accepted_as_green',
              'stepful_failure_stays_source_failure_even_with_admission_hint',
          )
          for token in required:
              assert token in source, token

          for forbidden in (
              'std::fs', 'std::process', 'Command::', 'reqwest', 'octocrab',
              'unsafe {', 'contains("billing")', 'contains("quota")',
          ):
              assert forbidden not in source, forbidden

          assert 'mod hosted_ci;' in main
          for job in ('  rust:\n', '  provenance:\n', '  gitleaks:\n'):
              assert job in workflow, job
          PY
          sha256sum src/hosted_ci.rs src/main.rs .github/workflows/hosted-ci-classifier.yml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
          submodules: false
      - name: Verify exact checkout and complete history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 5 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan exact candidate commit range and current tree
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "${PR_BASE_SHA}^{commit}"
            git cat-file -e "${PR_HEAD_SHA}^{commit}"
            comparison_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            log_opts="${comparison_base}..${PR_HEAD_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" =~ ^[a-f0-9]{40}$ && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            [[ "$CURRENT_SHA" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            log_opts="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
          else
            [[ "$CURRENT_SHA" =~ ^[a-f0-9]{40}$ ]]
            log_opts="-n 1 ${CURRENT_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$log_opts" .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
