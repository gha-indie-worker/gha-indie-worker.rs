name: hosted CI classifier

on:
  pull_request:
    paths:
      - src/hosted_ci.rs
      - src/main.rs
      - .github/workflows/hosted-ci-classifier.yml
      - 'imports/k8s-cluster/gha-capacity-broker-rs/**'
      - K8S_EXTRACTION_20260927.md
      - .github/workflows/capacity-import-proof.yml
      - .gitleaksignore
  push:
    branches: [main]
    paths:
      - src/hosted_ci.rs
      - src/main.rs
      - .github/workflows/hosted-ci-classifier.yml
      - 'imports/k8s-cluster/gha-capacity-broker-rs/**'
      - K8S_EXTRACTION_20260927.md
      - .github/workflows/capacity-import-proof.yml
      - .gitleaksignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-classifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check classifier formatting
        run: rustfmt --edition 2021 --check src/hosted_ci.rs
      - name: Compile and execute dependency-free classifier tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src/hosted_ci.rs -o "${RUNNER_TEMP}/hosted-ci-tests"
          "${RUNNER_TEMP}/hosted-ci-tests"
      - name: Compile, Clippy and test the exact imported capacity-policy crate
        shell: bash
        run: |
          set -euo pipefail
          manifest=imports/k8s-cluster/gha-capacity-broker-rs/Cargo.toml
          cargo check --locked --manifest-path "$manifest" --all-targets
          cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --locked --manifest-path "$manifest" --all-targets

  provenance:
    name: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Verify exact candidate and pure-classifier boundary
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/hosted_ci.rs').read_text(encoding='utf-8')
          main = Path('src/main.rs').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/hosted-ci-classifier.yml').read_text(encoding='utf-8')

          required = (
              'ZeroStepRunnerAdmissionFailure',
              'ZeroStepUnknown',
              'RunnerAdmissionHint',
              'self.step_count.unwrap_or(0) > 0',
              'self.admission_hint.is_some()',
              'zero_step_success_is_not_accepted_as_green',
              'stepful_failure_stays_source_failure_even_with_admission_hint',
          )
          for token in required:
              assert token in source, token

          for forbidden in (
              'std::fs', 'std::process', 'Command::', 'reqwest', 'octocrab',
              'unsafe {', 'contains("billing")', 'contains("quota")',
          ):
              assert forbidden not in source, forbidden

          assert 'mod hosted_ci;' in main
          for job in ('  rust:\n', '  provenance:\n', '  gitleaks:\n'):
              assert job in workflow, job
          PY
          sha256sum src/hosted_ci.rs src/main.rs .github/workflows/hosted-ci-classifier.yml
      - name: Verify exact imported source identity and manifest presence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git hash-object imports/k8s-cluster/gha-capacity-broker-rs/src/lib.rs)" = '45b1734ba22789ae4eb6908c48b48a770a69a38b'
          git ls-files --error-unmatch imports/k8s-cluster/gha-capacity-broker-rs/Cargo.toml
          git ls-files --error-unmatch imports/k8s-cluster/gha-capacity-broker-rs/Cargo.lock
          git ls-files --error-unmatch imports/k8s-cluster/gha-capacity-broker-rs/tests/capacity_policy.rs
          git diff --check
          git rev-parse 'HEAD^{tree}'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
          fetch-depth: 0
      - name: Reject credential-shaped material in classifier slice
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' src/hosted_ci.rs src/main.rs K8S_EXTRACTION_20260927.md imports/k8s-cluster/gha-capacity-broker-rs .github/workflows/hosted-ci-classifier.yml; then
            echo 'credential-shaped material is forbidden' >&2
            exit 1
          fi
          git diff --check
      - name: Require one exact evidence-bound false-positive fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          entries = [line.strip() for line in Path('.gitleaksignore').read_text().splitlines()
                     if line.strip() and not line.lstrip().startswith('#')]
          assert entries == [
              '71b76373ad32d0a762329cfa2e245d3588cd7551:Cargo.lock:generic-api-key:434'
          ], 'reject broad or unexpected secret-scan exceptions'
          PY
      - name: Install checksum-pinned Gitleaks scanner
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --output "${RUNNER_TEMP}/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          test "$("${RUNNER_TEMP}/gitleaks" version)" = "${version}"
      - name: Scan complete exact-head Git history
        run: "${RUNNER_TEMP}/gitleaks git --redact --no-banner --verbose ."
