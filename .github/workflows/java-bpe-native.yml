name: Java BPE native exact-subtree
on:
  push:
    branches:
      - validation/java-bpe-native-20261027
permissions:
  contents: read
jobs:
  native-bpe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact compiler and subject Git identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:compiler/src/main)" = "989669aaa80d0f2285dd5ce7594d8fa9c04227fb"
          test "$(git rev-parse HEAD:compiler/stdlib)" = "711c0751213039f6d047099aad9fa9e754eb8ce6"
          test "$(git rev-parse HEAD:compiler/pom.xml)" = "8cf5eb37b685834ba79860d2fb693efc319c51e3"
          test "$(git rev-parse HEAD:compiler/scripts/build-native-thread.sh)" = "d7d79b3af7aae08a5277fe63ca6b6047c0da9aa6"
          test "$(git rev-parse HEAD:subject)" = "09e400a24a0c2e65b33fa425af342bf75b56aee1"
          echo "exact compiler/subject provenance: PASS"
      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: GraalVM diagnostics
        run: |
          java --version
          mvn --version
          command -v native-image || true
      - name: Build exact Java compiler closure
        working-directory: compiler
        run: mvn -B -ntp -DskipTests package
      - name: Check data-science suite
        working-directory: compiler
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="--check ../subject/tests/main.ores"
      - name: Execute data-science suite
        working-directory: compiler
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests exec:java -Dexec.args="../subject/tests/main.ores" | tee /tmp/data-science-native.out
          grep -F "ORES_TEST|SUMMARY|total=16|passed=16|failed=0|skipped=0|filtered=0" /tmp/data-science-native.out
