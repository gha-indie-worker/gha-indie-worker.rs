name: litegraph-pr8-no-secret-carrier

on:
  pull_request:
    paths:
      - 'carrier/litegraph-pr8/**'
      - '.github/workflows/litegraph-pr8-no-secret-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pinned-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify mirrored blobs and immutable source pins
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r sha path; do
            case "$sha" in \#*|"") continue;; esac
            actual="$(git hash-object "$path")"
            test "$actual" = "$sha" || {
              echo "::error file=$path::blob mismatch: expected $sha got $actual"
              exit 1
            }
          done < carrier/litegraph-pr8/blob-manifest.tsv
          cd carrier/litegraph-pr8/subject
          grep -F 'litegraph-gpu-host = { git = "https://github.com/litegraph/litegraph-gpu-host", rev = "9154bc3d3cbf62109fcd354256fd800b33198ebc" }' Cargo.toml
          grep -F 'litegraph-modeld = { git = "https://github.com/litegraph/litegraph-modeld", rev = "07dc685521cb1edaf36abea85491c7e9a2a00fb5" }' Cargo.toml
          grep -F 'litegraph-runtime = { git = "https://github.com/litegraph/litegraph-runtime", rev = "f16c6e95bcc66c84bcbb49a524ee3fbd7087fdcd" }' Cargo.toml

      - name: Replace network fetches with exact mirrored dependency trees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("carrier/litegraph-pr8/subject/Cargo.toml")
          s = p.read_text()
          replacements = {
              'litegraph-gpu-host = { git = "https://github.com/litegraph/litegraph-gpu-host", rev = "9154bc3d3cbf62109fcd354256fd800b33198ebc" }':
                  'litegraph-gpu-host = { path = "../deps/litegraph-gpu-host" }',
              'litegraph-modeld = { git = "https://github.com/litegraph/litegraph-modeld", rev = "07dc685521cb1edaf36abea85491c7e9a2a00fb5" }':
                  'litegraph-modeld = { path = "../deps/litegraph-modeld" }',
              'litegraph-runtime = { git = "https://github.com/litegraph/litegraph-runtime", rev = "f16c6e95bcc66c84bcbb49a524ee3fbd7087fdcd" }':
                  'litegraph-runtime = { path = "../deps/litegraph-runtime" }',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"expected exactly one pinned dependency line: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY
          ! grep -q 'git = "https://github.com/litegraph/' carrier/litegraph-pr8/subject/Cargo.toml

      - name: Rust diagnostics
        run: rustc --version && cargo --version

      - name: Formatting
        run: cargo fmt --manifest-path carrier/litegraph-pr8/subject/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path carrier/litegraph-pr8/subject/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --manifest-path carrier/litegraph-pr8/subject/Cargo.toml --all-features
