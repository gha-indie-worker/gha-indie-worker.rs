name: Native fleet protocol

on:
  pull_request:
    paths:
      - .github/workflows/native-fleet-protocol.yml
      - docs/NATIVE_FLEET_PROTOCOL.md
      - policy/native-fleet-protocol-v1.json
      - tools/native_fleet_*.py
      - tests/native_fleet_test_support.py
      - tests/test_native_fleet_*.py
  push:
    branches: [main]
    paths:
      - .github/workflows/native-fleet-protocol.yml
      - docs/NATIVE_FLEET_PROTOCOL.md
      - policy/native-fleet-protocol-v1.json
      - tools/native_fleet_*.py
      - tests/native_fleet_test_support.py
      - tests/test_native_fleet_*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol simulator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate machine-readable contract
        run: python -m json.tool policy/native-fleet-protocol-v1.json
      - name: Run protocol and fault tests
        run: python -m unittest discover -s tests -p "test_native_fleet_*.py" -v
      - name: Compile protocol sources
        run: python -c "import pathlib, py_compile; files=sorted(pathlib.Path('tools').glob('native_fleet_*.py')) + [pathlib.Path('tests/native_fleet_test_support.py')] + sorted(pathlib.Path('tests').glob('test_native_fleet_*.py')); [py_compile.compile(str(path), doraise=True) for path in files]"
