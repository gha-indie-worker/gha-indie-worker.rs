name: one-shot rustfmt

on:
  push:
    branches:
      - tmp/format-laptop-ci

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/format-laptop-ci
          fetch-depth: 1

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Format Rust sources and remove one-shot workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/one-shot-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: rustfmt laptop CI branch'
          git push origin HEAD:tmp/format-laptop-ci
