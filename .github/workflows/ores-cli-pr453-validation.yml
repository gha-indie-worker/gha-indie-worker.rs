name: ores-cli PR453 exact changed-blob validation

on:
  push:
    branches:
      - "test/ores-cli-pr453-compile-mirror2"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Validate exact changed Rust syntax and formatting
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            mirror/src/org/actions.rs \
            mirror/src/org/names.rs \
            mirror/src/org/workspace.rs \
            mirror/tests/admin_mcp_contract.rs
          rustfmt --edition 2024 --emit stdout mirror/src/flags.rs >/dev/null
          grep -F 'CliCommand::OrgWorkspace(options)' mirror/src/lib.rs
          grep -F 'WorkspaceAction::Sync' mirror/src/flags.rs
          grep -F 'ORES_CLI_ORG_SYNC_DIR' mirror/src/flags.rs
      - name: Compile exact workspace engine and parse exact flags contract
        working-directory: validation/ores-cli-pr453
        run: cargo test

# validation-head
