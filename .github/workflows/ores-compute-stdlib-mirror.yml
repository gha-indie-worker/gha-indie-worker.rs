name: Ores compute provider G3 validation

on:
  push:
    branches:
      - test/ores-compute-provider-g3-20261021
  pull_request:

permissions:
  contents: read

concurrency:
  group: ores-compute-g3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Assert exact carrier head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check

      - name: Verify exact mirrored source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(
              Path("tmp/ores-compute-validation/source-manifest.json").read_text()
          )
          expected = {
              "java_head": "66971839c52c241e0c5203ad43efc3c65c4a975d",
              "llvm_head": "6f181e79164c5b0c45067aabd32da55e90cb64c1",
              "common_head": "3b36e9ee1a940c708c532742a87071c5b04b829f",
              "profiles_head": "a9f06703926ffedb48d031db835cb6920033f65f",
              "opencl_java_head": "d23d433e4f8964cf917cf0a8045b4230704deaec",
              "opencl_llvm_head": "b8bcebb98b7e5b66f22ff31f5c1776152097886e",
              "opencl_common_head": "9f26644e15733bdb82e396f54608579564889c60",
              "g3_java_head": "e6560e4228f7e7e7d09f94ebd37ff44e20eeae08",
              "g3_llvm_head": "2e8069f76c5a02d345de4af62c24658d654ffed6",
              "g3_common_head": "5cf8f97524ef2af9310a641e956e395e6cb1fcfe",
              "g3_profiles_head": "8bc8f0c9eb6845f0d0bc87452a477cf607dc91ce",
          }
          for key, value in expected.items():
              assert manifest[key] == value, (key, manifest[key], value)

          for item in manifest["files"]:
              data = Path(item["dest"]).read_bytes()
              payload = f"blob {len(data)}\0".encode() + data
              actual = hashlib.sha1(payload).hexdigest()
              assert actual == item["source_blob_sha"], (
                  item["dest"], actual, item["source_blob_sha"]
              )
              assert item["source_ref"] in (
                  "main",
                  "feat/portable-compute-opencl-g2",
                  "feat/portable-compute-provider-g3",
              )
          print("exact-provider-g3-mirror-provenance-ok")
          PY

      - name: Compile mirrored Java compute runtime and conformance
        shell: bash
        run: |
          set -euo pipefail
          javac -version
          rm -rf tmp/ores-compute-validation/out
          mkdir -p tmp/ores-compute-validation/out
          javac -Xlint:all -Werror \
            -d tmp/ores-compute-validation/out \
            tmp/ores-compute-validation/java/dev/oreslang/runtime/compute/*.java

      - name: Run Java registry and authority adversarial gates
        shell: bash
        run: |
          set -euo pipefail
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.ComputeRegistrySmoke
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.ComputeAuthoritySmoke

      - name: Run Java trusted G3 provider failure matrix
        shell: bash
        run: |
          set -euo pipefail
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.TrustedOpenClProviderSmoke

      - name: Run Java G2 CPU reference gate
        shell: bash
        run: |
          set -euo pipefail
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.PortableKernelSmoke
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.PortableKernelConformanceMain \
            > "${RUNNER_TEMP}/java-kernel.txt"
          cat "${RUNNER_TEMP}/java-kernel.txt"
          java -cp tmp/ores-compute-validation/out \
            dev.oreslang.runtime.compute.PortableOpenClConformanceMain \
            > "${RUNNER_TEMP}/java-opencl.txt"
          cat "${RUNNER_TEMP}/java-opencl.txt"

      - name: Validate common compute contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/ores-compute-validation/validate.py

      - name: Verify accelerator source syntax remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          token = Path("tmp/ores-compute-validation/parser-java/Token.java").read_text()
          lexer = Path("tmp/ores-compute-validation/parser-java/Lexer.java").read_text()
          parser = Path("tmp/ores-compute-validation/parser-java/Parser.java").read_text()
          native = Path("tmp/ores-compute-validation/parser-native/Parser.cpp").read_text()

          assert "GPU, CPU, QUANTUM" in token
          for word in ("gpu", "cpu", "quantum"):
              assert f'KEYWORDS.put("{word}"' in lexer
              assert f"execution domain '" in parser
              assert "no implicit CPU fallback" in parser
              assert word in native
          assert "native execution domain lowering unsupported" in native
          assert "no implicit CPU fallback" in native
          print("accelerator-source-syntax-fail-closed-ok")
          PY

      - name: Compile and run native descriptor and authority gates
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"
          c++ $CXXFLAGS $INC \
            tmp/ores-compute-validation/cpp/portable_compute_descriptor_test.cpp \
            -o "${RUNNER_TEMP}/descriptor"
          "${RUNNER_TEMP}/descriptor"

          c++ $CXXFLAGS -pthread $INC \
            tmp/ores-compute-validation/cpp/portable_compute_authority_test.cpp \
            -o "${RUNNER_TEMP}/authority"
          "${RUNNER_TEMP}/authority"

      - name: Run native reserved-submitted GPU fence gates
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"

          c++ $CXXFLAGS -pthread $INC \
            tmp/ores-compute-validation/cpp/gpu_buffer_fence_test.cpp \
            -o "${RUNNER_TEMP}/gpu-fence"
          "${RUNNER_TEMP}/gpu-fence"

          c++ $CXXFLAGS -pthread $INC \
            tmp/ores-compute-validation/cpp/dop_gpu_admission_test.cpp \
            -o "${RUNNER_TEMP}/gpu-admission"
          "${RUNNER_TEMP}/gpu-admission"

      - name: Run native trusted G3 provider state machine
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"
          c++ $CXXFLAGS -pthread $INC \
            tmp/ores-compute-validation/cpp/opencl_provider_g3_test.cpp \
            -o "${RUNNER_TEMP}/opencl-provider-g3"
          "${RUNNER_TEMP}/opencl-provider-g3"

      - name: Probe real OpenCL GPU conditionally
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"
          c++ $CXXFLAGS -pthread $INC \
            tmp/ores-compute-validation/cpp/opencl_system_gpu_probe.cpp \
            -ldl \
            -o "${RUNNER_TEMP}/opencl-real-gpu-probe"
          "${RUNNER_TEMP}/opencl-real-gpu-probe" | tee "${RUNNER_TEMP}/real-gpu-probe.txt"
          if grep -q '^opencl-real-gpu-probe-passed:' "${RUNNER_TEMP}/real-gpu-probe.txt"; then
            echo "real-gpu-execution-evidence=passed"
          else
            grep -q '^opencl-real-gpu-probe-skipped:no-compatible-gpu
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"
          c++ $CXXFLAGS $INC \
            tmp/ores-compute-validation/cpp/portable_compute_kernel_g2_test.cpp \
            -o "${RUNNER_TEMP}/kernel-g2"
          "${RUNNER_TEMP}/kernel-g2" > "${RUNNER_TEMP}/native-kernel.txt"
          cat "${RUNNER_TEMP}/native-kernel.txt"
          diff -u "${RUNNER_TEMP}/java-kernel.txt" "${RUNNER_TEMP}/native-kernel.txt"
          echo "java-native-kernel-bit-parity-ok"

          c++ $CXXFLAGS $INC \
            tmp/ores-compute-validation/cpp/portable_compute_opencl_g2_test.cpp \
            -o "${RUNNER_TEMP}/opencl-g2"
          "${RUNNER_TEMP}/opencl-g2" > "${RUNNER_TEMP}/native-opencl.txt"
          cat "${RUNNER_TEMP}/native-opencl.txt"
          diff -u "${RUNNER_TEMP}/java-opencl.txt" "${RUNNER_TEMP}/native-opencl.txt"
          echo "java-native-opencl-artifact-parity-ok"

      - name: Validate accelerator build-profile constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("tmp/ores-compute-validation/profiles")
          contract = json.loads((root / "build-profiles-v1.json").read_text())
          schema = json.loads((root / "build-profiles.schema.json").read_text())
          accel = contract["constraints"]["accelerators"]
          expected = {
              "providerDiscovery": "explicit-only",
              "implicitTransfers": "forbidden",
              "implicitCpuFallback": "forbidden",
              "sourceForgeableAuthority": "forbidden",
              "cancellationQuiescence": "verified-fence-only",
              "strictAotKernelVariants": "precompiled-only",
              "hardRtResourceBounds": "required",
              "hardRtProviderCompilation": "forbidden-in-execution-phase",
              "sourceAcceleratorSyntax": "fail-closed-until-typed-effects",
              "cpuReferenceProvider": "explicit-test-only",
              "kernelIrReflection": "forbidden",
              "gpuArtifactEmissionEvidence": "not-execution-evidence",
              "physicalProviderBackend": "opencl-1.2",
              "physicalProviderGuestLoad": "forbidden",
              "providerQuotaAuthority": "provider-owned",
              "providerPreEnqueueAbort": "reserved-only",
              "realGpuExecutionEvidence": "exact-device-event-plus-download",
              "hardRtPhysicalProvider": "bounded-certified-only",
          }
          assert accel == expected
          props = schema["properties"]["constraints"]["properties"]["accelerators"]
          assert props["additionalProperties"] is False
          assert set(props["required"]) == set(expected)
          for key, value in expected.items():
              assert props["properties"][key]["const"] == value
          print("accelerator-g3-build-profile-contract-ok")
          PY
 "${RUNNER_TEMP}/real-gpu-probe.txt"
            echo "real-gpu-execution-evidence=not-available"
          fi

      - name: Run native G2 CPU reference and compare bit transcript
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror"
          INC="-Itmp/ores-compute-validation/cpp"
          c++ $CXXFLAGS $INC \
            tmp/ores-compute-validation/cpp/portable_compute_kernel_g2_test.cpp \
            -o "${RUNNER_TEMP}/kernel-g2"
          "${RUNNER_TEMP}/kernel-g2" > "${RUNNER_TEMP}/native-kernel.txt"
          cat "${RUNNER_TEMP}/native-kernel.txt"
          diff -u "${RUNNER_TEMP}/java-kernel.txt" "${RUNNER_TEMP}/native-kernel.txt"
          echo "java-native-kernel-bit-parity-ok"

          c++ $CXXFLAGS $INC \
            tmp/ores-compute-validation/cpp/portable_compute_opencl_g2_test.cpp \
            -o "${RUNNER_TEMP}/opencl-g2"
          "${RUNNER_TEMP}/opencl-g2" > "${RUNNER_TEMP}/native-opencl.txt"
          cat "${RUNNER_TEMP}/native-opencl.txt"
          diff -u "${RUNNER_TEMP}/java-opencl.txt" "${RUNNER_TEMP}/native-opencl.txt"
          echo "java-native-opencl-artifact-parity-ok"

      - name: Validate accelerator build-profile constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("tmp/ores-compute-validation/profiles")
          contract = json.loads((root / "build-profiles-v1.json").read_text())
          schema = json.loads((root / "build-profiles.schema.json").read_text())
          accel = contract["constraints"]["accelerators"]
          expected = {
              "providerDiscovery": "explicit-only",
              "implicitTransfers": "forbidden",
              "implicitCpuFallback": "forbidden",
              "sourceForgeableAuthority": "forbidden",
              "cancellationQuiescence": "verified-fence-only",
              "strictAotKernelVariants": "precompiled-only",
              "hardRtResourceBounds": "required",
              "hardRtProviderCompilation": "forbidden-in-execution-phase",
              "sourceAcceleratorSyntax": "fail-closed-until-typed-effects",
              "cpuReferenceProvider": "explicit-test-only",
              "kernelIrReflection": "forbidden",
              "gpuArtifactEmissionEvidence": "not-execution-evidence",
          }
          assert accel == expected
          props = schema["properties"]["constraints"]["properties"]["accelerators"]
          assert props["additionalProperties"] is False
          assert set(props["required"]) == set(expected)
          for key, value in expected.items():
              assert props["properties"][key]["const"] == value
          print("accelerator-g2-build-profile-contract-ok")
          PY
