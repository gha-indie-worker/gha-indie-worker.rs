name: Ores compute stdlib mirror validation

on:
  push:
    branches:
      - test/ores-compute-main-hardening-20261021
  pull_request:

permissions:
  contents: read

concurrency:
  group: ores-compute-stdlib-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check
      - name: Verify mirrored source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("tmp/ores-compute-validation/source-manifest.json").read_text())
          expected_heads = {
              "java_head": "82f02cc3b4d096ec014104a51dfaceab5b4688c4",
              "llvm_head": "a23d0b30ef8f05a786e01ee2c26cdd475071be68",
              "common_head": "c3740b580d6c38653a5943bff7dee0cb9e472949",
              "profiles_head": "d6b8a032b3a6751e4c44b822221623048bcd841f",
          }
          for key, value in expected_heads.items():
              assert manifest[key] == value, (key, manifest[key], value)
          for item in manifest["files"]:
              data = Path(item["dest"]).read_bytes()
              payload = f"blob {len(data)}\0".encode() + data
              actual = hashlib.sha1(payload).hexdigest()
              assert actual == item["source_blob_sha"], (item["dest"], actual, item["source_blob_sha"])
          print("mirror-provenance-ok")
          PY
      - name: Compile mirrored Java compute SPI
        shell: bash
        run: |
          set -euo pipefail
          javac -version
          mkdir -p tmp/ores-compute-validation/out
          javac -d tmp/ores-compute-validation/out             tmp/ores-compute-validation/java/dev/oreslang/runtime/compute/*.java
      - name: Run provider-registry smoke
        shell: bash
        run: |
          set -euo pipefail
          java -cp tmp/ores-compute-validation/out             dev.oreslang.runtime.compute.ComputeRegistrySmoke
      - name: Validate portable stdlib contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/ores-compute-validation/validate.py
      - name: Compile and run native descriptor parity
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror             -Itmp/ores-compute-validation/cpp             tmp/ores-compute-validation/cpp/portable_compute_descriptor_test.cpp             -o "${RUNNER_TEMP}/ores-compute-descriptor-test"
          "${RUNNER_TEMP}/ores-compute-descriptor-test"
      - name: Validate accelerator build-profile constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("tmp/ores-compute-validation/profiles")
          contract = json.loads((root / "build-profiles-v1.json").read_text())
          schema = json.loads((root / "build-profiles.schema.json").read_text())
          accel = contract["constraints"]["accelerators"]
          expected = {
              "providerDiscovery": "explicit-only",
              "implicitTransfers": "forbidden",
              "implicitCpuFallback": "forbidden",
              "sourceForgeableAuthority": "forbidden",
              "cancellationQuiescence": "verified-fence-only",
              "strictAotKernelVariants": "precompiled-only",
              "hardRtResourceBounds": "required",
              "hardRtProviderCompilation": "forbidden-in-execution-phase",
          }
          assert accel == expected
          assert "accelerators" in schema["properties"]["constraints"]["required"]
          props = schema["properties"]["constraints"]["properties"]["accelerators"]
          assert props["additionalProperties"] is False
          assert set(props["required"]) == set(expected)
          for key, value in expected.items():
              assert props["properties"][key]["const"] == value
          print("accelerator-build-profile-contract-ok")
          PY
