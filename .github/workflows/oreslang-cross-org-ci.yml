name: oreslang-cross-org-ci

on:
  push:
    branches:
      - test/oreslang-lexical-privacy-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision without external actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run on GraalVM 25.3 compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/graalvm/jdk-community:25i3'
          docker pull "$image"

          maven_home="$(mvn -version | awk -F': ' '/^Maven home:/ {print $2}')"
          test -d "$maven_home"
          mkdir -p "$HOME/.m2"

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$maven_home:/opt/maven:ro" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            "$image" \
            /bin/sh -lc '
              set -eu
              java -version
              if ! /opt/maven/bin/mvn -B -ntp verify > /workspace/.ores-verify.log 2>&1; then
                cat /workspace/.ores-verify.log
                exit 1
              fi
              cat /workspace/.ores-verify.log

              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/callables.ores" > /workspace/.ores-callables.log 2>&1
              cat /workspace/.ores-callables.log
            '

          grep -F 'Tests run: 82, Failures: 0, Errors: 0, Skipped: 0' .ores-verify.log
          if grep -F 'fallback runtime' .ores-verify.log; then
            echo 'Unexpected Truffle fallback runtime' >&2
            exit 1
          fi
          grep -F '120:9:13' .ores-callables.log
