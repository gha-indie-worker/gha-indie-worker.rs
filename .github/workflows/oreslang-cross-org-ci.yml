name: oreslang-pr35-exact-head-ci

on:
  push:
    branches:
      - test/oreslang-shared-actors-pr35-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact oreslang PR #35 head
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          cd source
          git init .
          git remote add origin "https://github.com/ores-truffle-oreslang/oreslang-source.java.git"
          git fetch --depth=1 origin "1a618406537e77c0858f74a753ad5277c6c1836c"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "1a618406537e77c0858f74a753ad5277c6c1836c"
          echo "validated_source_sha=$(git rev-parse HEAD)" | tee ../validated-source-sha.txt

      - name: Verify exact head on GraalVM 25.3
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/graalvm/jdk-community:25i3'
          docker pull "$image"

          maven_home="$(mvn -version | awk -F': ' '/^Maven home:/ {print $2}')"
          test -d "$maven_home"
          mkdir -p "$HOME/.m2"

          docker run --rm \
            -v "$PWD/source:/workspace" \
            -v "$maven_home:/opt/maven:ro" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            "$image" \
            /bin/sh -lc '
              set -eu
              java -version
              /opt/maven/bin/mvn -B -ntp verify

              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/callables.ores"
            '
