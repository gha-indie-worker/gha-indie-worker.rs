name: oreslang-cross-org-ci

on:
  push:
    branches:
      - test/oreslang-lexical-privacy-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision without external actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Temurin JDK 25 directly
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" \
            --output /tmp/jdk25.tar.gz
          mkdir -p /tmp/jdk25
          tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
          echo "JAVA_HOME=/tmp/jdk25" >> "${GITHUB_ENV}"
          echo "/tmp/jdk25/bin" >> "${GITHUB_PATH}"

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version
          java -version 2>&1 | grep -F 'version "25'

      - name: Verify compiler and runtime tests
        run: mvn -B -ntp verify

      - name: Run Oreslang examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/callables.ores" | tee /tmp/oreslang-callables.out
          grep -F "120:9:13" /tmp/oreslang-callables.out
