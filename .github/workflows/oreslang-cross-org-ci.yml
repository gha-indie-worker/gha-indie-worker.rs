name: oreslang-pr35-exact-head-ci

on:
  push:
    branches:
      - test/oreslang-shared-actors-pr35-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out funded carrier revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prove materialized source is exact PR head
        shell: bash
        run: |
          set -euo pipefail
          expected='b8ff862b95250c257a5874a5252ad6c217ecf4f7'
          actual="$(awk '/^source_commit / {print $2}' source/.exact-head-manifest)"
          test "$actual" = "$expected"

          tail -n +2 source/.exact-head-manifest | while read -r blob path; do
            test -f "source/$path"
            actual_blob="$(git hash-object "source/$path")"
            if [ "$actual_blob" != "$blob" ]; then
              echo "blob mismatch: $path expected=$blob actual=$actual_blob" >&2
              exit 1
            fi
          done

          echo "Exact Oreslang source verified: $expected"

      - name: Verify exact head on GraalVM 25.3
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/graalvm/jdk-community:25i3'
          docker pull "$image"

          maven_home="$(mvn -version | awk -F': ' '/^Maven home:/ {print $2}')"
          test -d "$maven_home"
          mkdir -p "$HOME/.m2"

          docker run --rm \
            -v "$PWD/source:/workspace" \
            -v "$maven_home:/opt/maven:ro" \
            -v "$HOME/.m2:/root/.m2" \
            -w /workspace \
            "$image" \
            /bin/sh -lc '
              set -eu
              java -version
              /opt/maven/bin/mvn -B -ntp verify
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
              /opt/maven/bin/mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
            '
