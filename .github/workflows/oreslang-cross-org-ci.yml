name: oreslang-cross-org-ci

on:
  push:
    branches:
      - test/oreslang-lexical-privacy-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision without external actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install latest GraalVM Community JDK 25 directly
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location \
            'https://api.github.com/repos/graalvm/graalvm-ce-builds/releases?per_page=40')"
          graal_url="$(printf '%s' "$release_json" | jq -r '
            [.[] | select(.tag_name | startswith("jdk-25"))][0].assets[]?
            | select(.name | test("^graalvm-community-jdk-25.*_linux-x64_bin.tar.gz$"))
            | .browser_download_url
          ' | head -n 1)"
          test -n "$graal_url"
          test "$graal_url" != "null"
          echo "Using $graal_url"
          curl --fail --location --retry 3 "$graal_url" --output /tmp/graalvm25.tar.gz
          mkdir -p /tmp/graalvm25
          tar -xzf /tmp/graalvm25.tar.gz -C /tmp/graalvm25 --strip-components=1
          echo "JAVA_HOME=/tmp/graalvm25" >> "${GITHUB_ENV}"
          echo "/tmp/graalvm25/bin" >> "${GITHUB_PATH}"

      - name: Verify GraalVM Java and Maven
        run: |
          java -version
          mvn -version
          java -version 2>&1 | grep -i 'GraalVM'

      - name: Verify compiler and runtime tests
        run: mvn -B -ntp verify

      - name: Run Oreslang examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/callables.ores" | tee /tmp/oreslang-callables.out
          grep -F "120:9:13" /tmp/oreslang-callables.out
