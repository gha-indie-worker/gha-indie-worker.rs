name: Oreslang PR455 targeted Maven tests
on:
  push:
    branches:
      - feat/oreslang-pr455-source-mirror
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact immutable Oreslang source tree
        run: |
          set -eu
          git checkout --detach 5c2e66897df30e667b02eabf231adf3e606800eb
          actual="$(git rev-parse 'HEAD^{tree}')"
          echo "source tree $actual"
          test "$actual" = '54d50ca20a277928853af9b75992c5b3b7f45366'
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run targeted Oreslang regression suite
        run: mvn -B -ntp -Dtest=FailureEffectLanguageTest,ActorFailureIsolationTest,FailureKindTest,TrapOptionSemanticsTest,SourceActorSpawnExecutionTest test
