name: Oreslang PR459 guarded recursive type checks
on:
  push:
    branches:
      - test/oreslang-pr459-exact-tree-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursive-types:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source commit and blob tree
        run: |
          set -eu
          git checkout --detach 79d7562cec90fabcf246d91bf64ea3411e258389
          actual="$(git rev-parse 'HEAD^{tree}')"
          echo "expected source tree b545cbf961b51c5c2efd1b0fee172d58e925fdbb"
          echo "mirrored source tree $actual"
          test "$actual" = "b545cbf961b51c5c2efd1b0fee172d58e925fdbb"
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Run focused recursive-graph and structural regression tests
        run: |
          mvn -B -ntp -Dtest=RecursiveTypeGraphTest,BooleanTypeAliasTest,StaticStructAotTest,OptionResultSemanticsTest,ActorTransportHardeningTest,StructuralTypingHardeningTest test
