name: Planner formatter apply

on:
  pull_request:
    paths:
      - "src/lib.rs"
      - "src/workflow.rs"
      - "src/workflow_yaml.rs"
      - "src/bin/gha-workflow-plan.rs"
      - "src/bin/gha-workflow-server.rs"
      - ".github/workflows/planner-format-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Assemble standalone planner harness
        run: |
          rm -rf .planner-ci
          mkdir -p .planner-ci/src/bin
          cp src/lib.rs src/workflow.rs src/workflow_yaml.rs .planner-ci/src/
          cp src/bin/gha-workflow-plan.rs src/bin/gha-workflow-server.rs .planner-ci/src/bin/
          cat > .planner-ci/Cargo.toml <<'EOF'
          [package]
          name = "dd-build-server"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          axum = { version = "0.7", features = ["macros"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
          tracing = "0.1"
          EOF
      - name: Apply formatter in isolated crate
        run: cargo +1.97.0 fmt --manifest-path .planner-ci/Cargo.toml --all
      - name: Copy formatter-exact source back
        run: |
          cp .planner-ci/src/lib.rs .planner-ci/src/workflow.rs .planner-ci/src/workflow_yaml.rs src/
          cp .planner-ci/src/bin/gha-workflow-plan.rs .planner-ci/src/bin/gha-workflow-server.rs src/bin/
      - name: Commit formatted planner sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs src/workflow.rs src/workflow_yaml.rs src/bin/gha-workflow-plan.rs src/bin/gha-workflow-server.rs
          if ! git diff --cached --quiet; then
            git commit -m "Apply pinned Rust formatter to workflow planner"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Run strict Clippy
        run: cargo +1.97.0 clippy --manifest-path .planner-ci/Cargo.toml --all-targets -- -D warnings
      - name: Run planner tests
        run: cargo +1.97.0 test --manifest-path .planner-ci/Cargo.toml --all-targets
      - name: Exercise CLI planning
        run: |
          cat > .planner-ci/sample.yml <<'EOF'
          name: bounded-matrix
          jobs:
            build:
              runs-on: ubuntu-latest
              strategy:
                matrix:
                  rust: [stable, beta]
              steps:
                - run: cargo test
            report:
              needs: build
              runs-on: ubuntu-latest
              steps:
                - run: echo complete
          EOF
          cargo +1.97.0 run --quiet --manifest-path .planner-ci/Cargo.toml --bin gha-workflow-plan -- .planner-ci/sample.yml > .planner-ci/plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path(".planner-ci/plan.json").read_text())
          assert plan["schemaVersion"] == "gha-indie-worker.plan.v1"
          assert plan["jobOrder"] == ["build", "report"]
          assert len(plan["jobs"]) == 3
          report = next(job for job in plan["jobs"] if job["baseJobId"] == "report")
          assert report["needsInstances"] == ["build-1-rust-stable", "build-2-rust-beta"]
          PY
