name: Publish validated standalone source once

on:
  push:
    branches:
      - agent/publish-yaml-engine-20260804
    paths:
      - '.github/workflows/publish-validated-publication-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-validated-standalone-source-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/publish-yaml-engine-20260804
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify the branch contains only publication automation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          expected=$'.github/workflows/publish-validated-publication-once.yml\n.github/workflows/stage-canonical-publication.yml'
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected pre-publication branch paths:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Download the exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gha-indie-worker-publication
          path: ${{ runner.temp }}/validated-publication
          repository: gha-indie-worker/gha-indie-worker.rs
          run-id: 30955530882
          github-token: ${{ github.token }}

      - name: Verify artifact and install only non-workflow product files
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/validated-publication"
          archive="$artifact_dir/gha-indie-worker-publication.tar.gz"
          checksum="$artifact_dir/gha-indie-worker-publication.tar.gz.sha256"
          expected='53fb5a98d16eb022cd1e1221d4d36a9c13c112f9629d7a266dff02ba905093c3'
          test -s "$archive"
          test -s "$checksum"
          test "$(awk '{print $1}' "$checksum")" = "$expected"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$expected"

          automation="$RUNNER_TEMP/publication-automation"
          mkdir -p "$automation"
          cp .github/workflows/stage-canonical-publication.yml "$automation/"
          cp .github/workflows/publish-validated-publication-once.yml "$automation/"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          rm .github/workflows/ci.yml
          mkdir -p .github/workflows
          cp "$automation/stage-canonical-publication.yml" .github/workflows/
          cp "$automation/publish-validated-publication-once.yml" .github/workflows/

          test -s Cargo.lock
          test -s src/gha_workflow.rs
          grep -F '42b7471fa680331fe4977db42db8497ab9549cd9' SOURCE_PROVENANCE.md
          test "$(find . -path ./.git -prune -o -type f -print | wc -l)" -eq 41

      - name: Commit validated source without touching workflow paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'source publication unexpectedly modified a workflow path' >&2
            exit 1
          fi
          git commit -m 'feat: publish bounded GitHub Actions YAML engine source'
          git push origin HEAD:agent/publish-yaml-engine-20260804
