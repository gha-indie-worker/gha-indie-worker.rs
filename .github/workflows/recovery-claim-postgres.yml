name: recovery PostgreSQL CAS

on:
  pull_request:
    paths:
      - src/recovery_claim.rs
      - src/recovery_outbox.rs
      - src/recovery_state.rs
      - src/entity/gha_recovery_runs.rs
      - src/db.rs
      - tests/recovery_claim_postgres.rs
      - .github/workflows/recovery-claim-postgres.yml
  push:
    branches: [main]
    paths:
      - src/recovery_claim.rs
      - src/recovery_outbox.rs
      - tests/recovery_claim_postgres.rs
      - .github/workflows/recovery-claim-postgres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-postgres-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RECOVERY_TEST_DATABASE_URL: postgres://postgres:local_ci_only@localhost:5432/recovery_ci
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout immutable exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Validate exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
      - name: Install pinned Rust 1.97
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Format proof source
        run: |
          rustfmt --edition 2021 --check src/recovery_claim.rs src/recovery_outbox.rs tests/recovery_claim_postgres.rs src/entity/gha_recovery_runs.rs
      - name: Compile production claim primitive and run live PG tests
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/recovery-claim"
          mkdir -p "$scratch/src/entity" "$scratch/tests"
          cp src/recovery_claim.rs src/recovery_state.rs src/recovery_outbox.rs "$scratch/src/"
          cp src/entity/gha_recovery_runs.rs "$scratch/src/entity/"
          cp tests/recovery_claim_postgres.rs "$scratch/tests/"
          cat > "$scratch/src/lib.rs" <<'RS'
          #[allow(dead_code)]
          mod recovery_state;
          #[allow(dead_code)]
          mod recovery_claim;
          #[allow(dead_code)]
          mod recovery_outbox;
          mod entity {
              #[allow(dead_code)]
              pub(crate) mod gha_recovery_runs;
          }
          RS
          cat > "$scratch/Cargo.toml" <<'TOML'
          [package]
          name = "recovery-claim-postgres-harness"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json"] }
          tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          sha2 = "0.10"
          hex = "0.4"
          time = "=0.3.44"
          TOML
          cargo generate-lockfile --manifest-path "$scratch/Cargo.toml"
          RUSTFLAGS="-D warnings" cargo test --manifest-path "$scratch/Cargo.toml" --locked -- --nocapture
