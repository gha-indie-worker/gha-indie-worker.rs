name: recovery controller

on:
  pull_request:
    paths:
      - src/admission.rs
      - src/admission/github_api.rs
      - src/config.rs
      - src/db.rs
      - src/entity/gha_recovery_runs.rs
      - src/entity/mod.rs
      - src/http.rs
      - src/jobs.rs
      - src/main.rs
      - src/recovery.rs
      - src/recovery_policy.rs
      - src/recovery_state.rs
      - src/state.rs
      - src/webhooks.rs
      - .github/workflows/recovery-controller.yml
  push:
    branches: [agent/den-3440-recovery-controller-foundation-20261021]
    paths:
      - src/admission.rs
      - src/admission/github_api.rs
      - src/config.rs
      - src/db.rs
      - src/entity/gha_recovery_runs.rs
      - src/entity/mod.rs
      - src/http.rs
      - src/jobs.rs
      - src/main.rs
      - src/recovery.rs
      - src/recovery_policy.rs
      - src/recovery_state.rs
      - src/state.rs
      - src/webhooks.rs
      - .github/workflows/recovery-controller.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-rust:
    name: recovery-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Assert exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check

      - name: Install pinned Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt

      - name: Format recovery slice
        run: |
          rustfmt --edition 2021 --check \
            src/admission.rs \
            src/admission/github_api.rs \
            src/config.rs \
            src/db.rs \
            src/entity/gha_recovery_runs.rs \
            src/http.rs \
            src/jobs.rs \
            src/recovery.rs \
            src/recovery_policy.rs \
            src/recovery_state.rs \
            src/state.rs \
            src/webhooks.rs

      - name: Compile and test recovery controller in hermetic harness
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/recovery-controller"
          mkdir -p "$scratch/src/admission"
          cp src/admission.rs "$scratch/src/admission.rs"
          cp src/recovery.rs "$scratch/src/recovery.rs"

          cat > "$scratch/Cargo.toml" <<'TOML'
          [package]
          name = "recovery-controller-harness"
          version = "0.0.0"
          edition = "2021"

          [features]
          admission-api-harness = []

          [dependencies]
          hex = "0.4"
          serde_json = "1"
          sha2 = "0.10"
          TOML

          cat > "$scratch/src/lib.rs" <<'RS'
          mod admission;

          mod state {
              use std::sync::{
                  atomic::AtomicU64,
                  Arc,
              };

              #[derive(Clone)]
              pub(crate) struct Config {
                  pub(crate) github_recovery_enabled: bool,
                  pub(crate) github_recovery_token: Option<String>,
              }

              #[derive(Clone, Debug)]
              pub(crate) struct Database;

              #[derive(Default)]
              pub(crate) struct Counters {
                  pub(crate) github_recovery_observed: AtomicU64,
                  pub(crate) github_recovery_duplicates: AtomicU64,
                  pub(crate) github_recovery_fail_closed: AtomicU64,
              }

              #[derive(Clone)]
              pub(crate) struct AppState {
                  pub(crate) config: Arc<Config>,
                  pub(crate) db: Option<Database>,
                  pub(crate) counters: Arc<Counters>,
              }
          }

          mod db {
              use crate::{
                  admission::RunReceipt,
                  state::Database,
              };

              #[derive(Clone, Copy, Debug, PartialEq, Eq)]
              pub(crate) enum RecoveryObservationWrite {
                  Inserted,
                  DuplicateIdentical,
                  Contradictory,
              }

              pub(crate) async fn record_recovery_observation_strict(
                  _db: &Database,
                  _receipt: &RunReceipt,
              ) -> Result<RecoveryObservationWrite, ()> {
                  Ok(RecoveryObservationWrite::Inserted)
              }
          }

          #[allow(dead_code)]
          mod recovery;
          RS

          cargo generate-lockfile --manifest-path "$scratch/Cargo.toml"
          RUSTFLAGS="-D warnings" cargo test             --manifest-path "$scratch/Cargo.toml"             --locked             --lib             -- --nocapture

      - name: Verify pure crash/claim state model and deny-only policy
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src/recovery_state.rs -o "${RUNNER_TEMP}/recovery-state-tests"
          "${RUNNER_TEMP}/recovery-state-tests"
          rustc --edition 2021 --test -D warnings src/recovery_policy.rs -o "${RUNNER_TEMP}/recovery-policy-tests"
          "${RUNNER_TEMP}/recovery-policy-tests"

      - name: Verify production fail-closed wiring
        shell: bash
        run: |
          set -euo pipefail

          recovery_call="$(grep -nF 'maybe_handle_github_recovery(&state, &event, &payload).await' src/webhooks.rs | cut -d: -f1)"
          ordinary_dedupe="$(grep -nF 'let fresh = db::record_webhook_delivery(' src/webhooks.rs | head -1 | cut -d: -f1)"
          test -n "$recovery_call"
          test -n "$ordinary_dedupe"
          test "$recovery_call" -lt "$ordinary_dedupe"

          grep -Fq 'BUILD_SERVER_GH_RECOVERY_TOKEN' src/config.rs
          grep -Fq 'record_recovery_observation_strict' src/recovery.rs
          grep -Fq 'recovery_policy::decide(' src/recovery.rs
          grep -Fq 'failed_dispatch_transition_has_no_partial_mutations' src/recovery_state.rs
          grep -Fq 'RecoveryObservationWrite::Contradictory' src/recovery.rs
          grep -Fq 'table_name = "gha_recovery_runs"' src/entity/gha_recovery_runs.rs
          grep -Fq '"dispatch": false' src/webhooks.rs
          grep -Fq '"action": "recovery-conflict"' src/webhooks.rs
          grep -Fq 'github_recovery_enabled: false' src/http.rs
          grep -Fq 'github_recovery_token: None' src/http.rs
          grep -Fq 'github_recovery_enabled: false' src/jobs.rs
          grep -Fq 'github_recovery_token: None' src/jobs.rs
          grep -Fq 'github_recovery_observed' src/state.rs
          grep -Fq 'github_recovery_duplicates' src/state.rs
          grep -Fq 'github_recovery_fail_closed' src/state.rs
          grep -Fq '"mode": "observe-only"' src/http.rs

          if grep -Fq 'github-recovery' src/db.rs; then
            echo 'recovery persistence must not overload webhook_deliveries provider values' >&2
            exit 1
          fi

          for forbidden in             'enqueue_build'             'submit_from_nats'             'std::process'             'Command::'             'idempotency_finish'; do
            if grep -Fq "$forbidden" src/recovery.rs; then
              echo "recovery controller contains forbidden execution primitive: $forbidden" >&2
              exit 1
            fi
          done

          echo 'Recovery controller remains observe-only, canonical, and fail-closed.'
