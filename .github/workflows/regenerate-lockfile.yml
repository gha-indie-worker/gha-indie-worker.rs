name: Temporary standalone lockfile regeneration

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'vendor/**'
      - .github/workflows/regenerate-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.90.0
        with:
          toolchain: '1.90.0'
      - name: Generate and verify the current dependency graph
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked --all-targets
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
