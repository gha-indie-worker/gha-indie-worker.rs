name: Temporary standalone lockfile landing

on:
  push:
    branches:
      - audit/gha-parity-conformance-contract
    paths:
      - .github/workflows/regenerate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: land-standalone-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  land:
    if: github.repository == 'gha-indie-worker/gha-indie-worker.rs' && github.ref_name == 'audit/gha-parity-conformance-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact controlled branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/gha-parity-conformance-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.90.0
        with:
          toolchain: '1.90.0'
          components: clippy

      - name: Reproduce, verify, and land only the generated lock
        shell: bash
        env:
          EXPECTED_LOCK_SHA256: 29f1da9901b87f00bc0e0e680168d35620db14c6eadc4f46f6fe1c49bd989208
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gha-indie-worker/gha-indie-worker.rs'
          test "$GITHUB_REF_NAME" = 'audit/gha-parity-conformance-contract'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

          cargo generate-lockfile
          printf '%s  Cargo.lock\n' "$EXPECTED_LOCK_SHA256" | sha256sum --check --strict -
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

          git add -- Cargo.lock
          git rm -- .github/workflows/regenerate-lockfile.yml

          mapfile -t staged < <(git diff --cached --name-only | LC_ALL=C sort)
          expected=(.github/workflows/regenerate-lockfile.yml Cargo.lock)
          test "${#staged[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${staged[$index]}" = "${expected[$index]}"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit regenerated standalone Cargo lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
