name: DEN-1862 repair assertion correction

on:
  push:
    branches:
      - den-1862-log-sidecar-fanout

permissions:
  contents: write

jobs:
  correct:
    if: ${{ contains(github.event.head_commit.message, 'stage repair assertion correction') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-1862-log-sidecar-fanout
          persist-credentials: true
          fetch-depth: 0
          show-progress: false
      - name: Correct source-shape assertion and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/repair-den-1862-pipes.yml')
          text = path.read_text()
          old = "if text.count('tokio::net::UnixStream') != 4:"
          new = "if text.count('tokio::net::UnixStream') != 8:"
          if text.count(old) != 1:
              raise SystemExit('repair assertion did not match exactly once')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/repair-den-1862-assertion.yml
          git add .github/workflows/repair-den-1862-pipes.yml .github/workflows/repair-den-1862-assertion.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-1862: correct anonymous-pipe repair assertion'
          git push origin HEAD:den-1862-log-sidecar-fanout
