name: DEN-1862 source-only pipe repair

on:
  push:
    branches:
      - den-1862-log-sidecar-fanout

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'apply anonymous-pipe transport repair v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-1862-log-sidecar-fanout
          persist-credentials: true
          fetch-depth: 0
          show-progress: false
      - name: Reuse reviewed semantic patch without staging workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/repair-den-1862-pipes.yml')
          text = workflow.read_text().replace(
              "if text.count('tokio::net::UnixStream') != 4:",
              "if text.count('tokio::net::UnixStream') != 8:",
          )
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/den-1862-repair.py').write_text(script)
          PY
          python3 /tmp/den-1862-repair.py
          rustfmt --edition 2021 --config skip_children=true src/log_sidecar.rs tests/build_log_sidecar_e2e.rs
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked log_sidecar::tests:: -- --nocapture
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Commit only production repair
        shell: bash
        run: |
          set -euo pipefail
          git add src/log_sidecar.rs tests/build_log_sidecar_e2e.rs Cargo.toml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-1862: apply anonymous-pipe transport repair v2'
          git push origin HEAD:den-1862-log-sidecar-fanout
