name: DEN-1862 structural pipe repair

on:
  push:
    branches:
      - den-1862-log-sidecar-fanout

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'apply anonymous-pipe transport repair v3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-1862-log-sidecar-fanout
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - name: Apply marker-bounded transport repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/log_sidecar.rs')
          text = path.read_text()

          std_anchor = '#[cfg(unix)]\nuse std::process::Stdio;\n'
          std_replacement = '''#[cfg(unix)]
          use std::{
              os::fd::{AsRawFd, OwnedFd},
              process::Stdio,
          };
          '''
          if text.count(std_anchor) != 1:
              raise SystemExit('std unix import anchor mismatch')
          text = text.replace(std_anchor, std_replacement)

          tokio_anchor = '''#[cfg(unix)]
          use tokio::{
              io::AsyncWriteExt,
              process::{Child, Command},
          };
          '''
          tokio_replacement = '''#[cfg(unix)]
          use tokio::{
              io::AsyncWriteExt,
              net::unix::pipe::{self, Sender},
              process::{Child, Command},
          };
          '''
          if text.count(tokio_anchor) != 1:
              raise SystemExit('tokio unix import anchor mismatch')
          text = text.replace(tokio_anchor, tokio_replacement)

          start_marker = '#[cfg(unix)]\nfn spawn_supervisor('
          end_marker = '\n\n#[cfg(unix)]\nextern "C" {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''#[cfg(unix)]
          fn move_out_of_protocol_fds(fd: OwnedFd) -> io::Result<OwnedFd> {
              if !matches!(fd.as_raw_fd(), METADATA_FD | DATA_FD) {
                  return Ok(fd);
              }

              // `dup2(oldfd, oldfd)` does not clear close-on-exec. Keep every
              // protocol descriptor occupied while cloning until the source is
              // outside FD3/FD4, then `dup2` can safely install inheritable
              // blocking read ends at the documented child descriptors.
              let mut held = Vec::new();
              let mut current = fd;
              while matches!(current.as_raw_fd(), METADATA_FD | DATA_FD) {
                  let next = current.try_clone()?;
                  held.push(current);
                  current = next;
              }
              drop(held);
              Ok(current)
          }

          #[cfg(unix)]
          fn spawn_supervisor(
              spec: ReceiverSpec,
              receiver: mpsc::Receiver<QueuedChunk>,
              accounting: Arc<Accounting>,
          ) -> io::Result<JoinHandle<()>> {
              use std::os::unix::process::CommandExt;

              // The reference receiver reopens FD3/FD4 through `/dev/fd`, so
              // these must be real pipes rather than Unix-domain socketpairs.
              // Tokio keeps the parent write ends asynchronous and cancellable;
              // the child receives blocking read ends for ordinary file reads.
              let (metadata_writer, metadata_child) = pipe::pipe()?;
              let (data_writer, data_child) = pipe::pipe()?;
              let metadata_child =
                  move_out_of_protocol_fds(metadata_child.into_blocking_fd()?)?;
              let data_child = move_out_of_protocol_fds(data_child.into_blocking_fd()?)?;

              let metadata_child_fd = metadata_child.as_raw_fd();
              let data_child_fd = data_child.as_raw_fd();
              let mut command = Command::new(&spec.program);
              command
                  .args(&spec.args)
                  .env_clear()
                  .env("INDIEBUILD_LOG_METADATA_FD", METADATA_FD.to_string())
                  .env("INDIEBUILD_LOG_DATA_FD", DATA_FD.to_string())
                  .env("INDIEBUILD_LOG_PROTOCOL", METADATA_SCHEMA)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .kill_on_drop(true);
              for (key, value) in &spec.environment {
                  command.env(key, value);
              }

              // SAFETY: `pre_exec` is limited to async-signal-safe `dup2` calls.
              // Sources are guaranteed outside FD3/FD4, so each `dup2` also
              // clears close-on-exec on its target. OwnedFd sources stay alive
              // until `spawn` returns.
              unsafe {
                  command.as_std_mut().pre_exec(move || {
                      if dup2(metadata_child_fd, METADATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      if dup2(data_child_fd, DATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      Ok(())
                  });
              }

              let child = command.spawn()?;
              drop(metadata_child);
              drop(data_child);

              Ok(tokio::spawn(supervise(
                  child,
                  receiver,
                  metadata_writer,
                  data_writer,
                  accounting,
              )))
          }'''
          text = text[:start] + replacement + text[end:]

          count = text.count('tokio::net::UnixStream')
          if count != 8:
              raise SystemExit(f'unexpected UnixStream type count after supervisor repair: {count}')
          text = text.replace('tokio::net::UnixStream', 'Sender')

          helper_start_marker = '    #[cfg(unix)]\n    fn socket_pair()'
          helper_end_marker = '\n\n    #[cfg(unix)]\n    fn queued('
          helper_start = text.index(helper_start_marker)
          helper_end = text.index(helper_end_marker, helper_start)
          helper = '''    #[cfg(unix)]
              fn pipe_pair() -> (Sender, std::fs::File) {
                  let (writer, reader) = pipe::pipe().expect("anonymous unix pipe");
                  let reader = reader
                      .into_blocking_fd()
                      .expect("blocking anonymous pipe reader");
                  (writer, std::fs::File::from(reader))
              }'''
          text = text[:helper_start] + helper + text[helper_end:]
          calls = text.count('socket_pair()')
          if calls != 8:
              raise SystemExit(f'unexpected socket_pair call count after helper replacement: {calls}')
          text = text.replace('socket_pair()', 'pipe_pair()')

          if 'UnixStream::pair' in text:
              raise SystemExit('socketpair transport remains after repair')
          path.write_text(text)

          cargo = Path('Cargo.toml')
          cargo_text = cargo.read_text()
          old_tokio = 'tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }'
          new_tokio = 'tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }'
          if cargo_text.count(old_tokio) != 1:
              raise SystemExit('tokio manifest line mismatch')
          cargo.write_text(cargo_text.replace(old_tokio, new_tokio))
          PY

      - name: Format and verify exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true src/log_sidecar.rs tests/build_log_sidecar_e2e.rs
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked log_sidecar::tests:: -- --nocapture
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit production files only
        shell: bash
        run: |
          set -euo pipefail
          git add src/log_sidecar.rs tests/build_log_sidecar_e2e.rs Cargo.toml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-1862: apply anonymous-pipe transport repair v3'
          git push origin HEAD:den-1862-log-sidecar-fanout
