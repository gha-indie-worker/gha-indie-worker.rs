name: DEN-1862 pipe transport repair

on:
  push:
    branches:
      - den-1862-log-sidecar-fanout

permissions:
  contents: write

concurrency:
  group: den-1862-pipe-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'apply anonymous-pipe transport repair') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-1862-log-sidecar-fanout
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - name: Apply semantic transport repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/log_sidecar.rs')
          text = path.read_text()

          old = '''#[cfg(unix)]
          use std::process::Stdio;

          use serde::Serialize;
          use tokio::{sync::mpsc, task::JoinHandle, time::timeout};

          #[cfg(unix)]
          use tokio::{
              io::AsyncWriteExt,
              process::{Child, Command},
          };
          '''
          new = '''#[cfg(unix)]
          use std::{
              os::fd::{AsRawFd, OwnedFd},
              process::Stdio,
          };

          use serde::Serialize;
          use tokio::{sync::mpsc, task::JoinHandle, time::timeout};

          #[cfg(unix)]
          use tokio::{
              io::AsyncWriteExt,
              net::unix::pipe::{self, Sender},
              process::{Child, Command},
          };
          '''
          if text.count(old) != 1:
              raise SystemExit('expected import block not found exactly once')
          text = text.replace(old, new)

          old = '''#[cfg(unix)]
          fn spawn_supervisor(
              spec: ReceiverSpec,
              receiver: mpsc::Receiver<QueuedChunk>,
              accounting: Arc<Accounting>,
          ) -> io::Result<JoinHandle<()>> {
              use std::{
                  os::unix::process::CommandExt,
                  os::{fd::AsRawFd, unix::net::UnixStream},
              };

              let (metadata_writer, metadata_child) = UnixStream::pair()?;
              let (data_writer, data_child) = UnixStream::pair()?;
              metadata_writer.set_nonblocking(true)?;
              data_writer.set_nonblocking(true)?;

              let metadata_parent_fd = metadata_child.as_raw_fd();
              let data_parent_fd = data_child.as_raw_fd();
              let mut command = Command::new(&spec.program);
              command
                  .args(&spec.args)
                  .env_clear()
                  .env("INDIEBUILD_LOG_METADATA_FD", METADATA_FD.to_string())
                  .env("INDIEBUILD_LOG_DATA_FD", DATA_FD.to_string())
                  .env("INDIEBUILD_LOG_PROTOCOL", METADATA_SCHEMA)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .kill_on_drop(true);
              for (key, value) in &spec.environment {
                  command.env(key, value);
              }

              // SAFETY: `pre_exec` is limited to async-signal-safe `dup2` calls. The
              // source descriptors are owned by `UnixStream`s kept alive until `spawn`
              // returns. `dup2` atomically installs the read streams at the documented
              // child descriptor numbers and clears close-on-exec on those targets.
              unsafe {
                  command.as_std_mut().pre_exec(move || {
                      if dup2(metadata_parent_fd, METADATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      if dup2(data_parent_fd, DATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      Ok(())
                  });
              }

              let child = command.spawn()?;
              drop(metadata_child);
              drop(data_child);

              let metadata_writer = tokio::net::UnixStream::from_std(metadata_writer)?;
              let data_writer = tokio::net::UnixStream::from_std(data_writer)?;
              Ok(tokio::spawn(supervise(
                  child,
                  receiver,
                  metadata_writer,
                  data_writer,
                  accounting,
              )))
          }
          '''
          new = '''#[cfg(unix)]
          fn move_out_of_protocol_fds(fd: OwnedFd) -> io::Result<OwnedFd> {
              if !matches!(fd.as_raw_fd(), METADATA_FD | DATA_FD) {
                  return Ok(fd);
              }

              // `dup2(oldfd, oldfd)` does not clear close-on-exec. Keep every
              // protocol descriptor occupied while cloning until the source is
              // outside FD3/FD4, then `dup2` below can safely install inheritable
              // blocking read ends at the documented child descriptors.
              let mut held = Vec::new();
              let mut current = fd;
              while matches!(current.as_raw_fd(), METADATA_FD | DATA_FD) {
                  let next = current.try_clone()?;
                  held.push(current);
                  current = next;
              }
              drop(held);
              Ok(current)
          }

          #[cfg(unix)]
          fn spawn_supervisor(
              spec: ReceiverSpec,
              receiver: mpsc::Receiver<QueuedChunk>,
              accounting: Arc<Accounting>,
          ) -> io::Result<JoinHandle<()>> {
              use std::os::unix::process::CommandExt;

              // The reference receiver reopens FD3/FD4 through `/dev/fd`, which
              // requires real pipes rather than Unix-domain socketpairs. Tokio's
              // anonymous pipe keeps the parent writer nonblocking and cancellable
              // while `into_blocking_fd` gives the child the expected read end.
              let (metadata_writer, metadata_child) = pipe::pipe()?;
              let (data_writer, data_child) = pipe::pipe()?;
              let metadata_child =
                  move_out_of_protocol_fds(metadata_child.into_blocking_fd()?)?;
              let data_child = move_out_of_protocol_fds(data_child.into_blocking_fd()?)?;

              let metadata_child_fd = metadata_child.as_raw_fd();
              let data_child_fd = data_child.as_raw_fd();
              let mut command = Command::new(&spec.program);
              command
                  .args(&spec.args)
                  .env_clear()
                  .env("INDIEBUILD_LOG_METADATA_FD", METADATA_FD.to_string())
                  .env("INDIEBUILD_LOG_DATA_FD", DATA_FD.to_string())
                  .env("INDIEBUILD_LOG_PROTOCOL", METADATA_SCHEMA)
                  .stdin(Stdio::null())
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .kill_on_drop(true);
              for (key, value) in &spec.environment {
                  command.env(key, value);
              }

              // SAFETY: `pre_exec` is limited to async-signal-safe `dup2` calls.
              // `move_out_of_protocol_fds` guarantees neither source is FD3/FD4,
              // so `dup2` also clears close-on-exec on the two target descriptors.
              // The OwnedFd sources stay alive until `spawn` returns.
              unsafe {
                  command.as_std_mut().pre_exec(move || {
                      if dup2(metadata_child_fd, METADATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      if dup2(data_child_fd, DATA_FD) == -1 {
                          return Err(io::Error::last_os_error());
                      }
                      Ok(())
                  });
              }

              let child = command.spawn()?;
              drop(metadata_child);
              drop(data_child);

              Ok(tokio::spawn(supervise(
                  child,
                  receiver,
                  metadata_writer,
                  data_writer,
                  accounting,
              )))
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected socketpair supervisor block not found exactly once')
          text = text.replace(old, new)

          if text.count('tokio::net::UnixStream') != 4:
              raise SystemExit(f'unexpected UnixStream type count: {text.count("tokio::net::UnixStream")}')
          text = text.replace('tokio::net::UnixStream', 'Sender')

          old = '''    fn socket_pair() -> (Sender, std::os::unix::net::UnixStream) {
              let (writer, reader) = std::os::unix::net::UnixStream::pair().expect("unix socket pair");
              writer
                  .set_nonblocking(true)
                  .expect("set writer nonblocking");
              (
                  Sender::from_std(writer).expect("tokio unix stream"),
                  reader,
              )
          }
          '''
          new = '''    fn pipe_pair() -> (Sender, std::fs::File) {
              let (writer, reader) = pipe::pipe().expect("anonymous unix pipe");
              let reader = reader
                  .into_blocking_fd()
                  .expect("blocking anonymous pipe reader");
              (writer, std::fs::File::from(reader))
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected unit-test socket_pair helper not found exactly once')
          text = text.replace(old, new)
          if text.count('socket_pair()') != 8:
              raise SystemExit(f'unexpected socket_pair call count: {text.count("socket_pair()")}')
          text = text.replace('socket_pair()', 'pipe_pair()')

          path.write_text(text)

          cargo = Path('Cargo.toml')
          cargo_text = cargo.read_text()
          old_tokio = 'tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }'
          new_tokio = 'tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }'
          if cargo_text.count(old_tokio) != 1:
              raise SystemExit('expected tokio dependency line not found exactly once')
          cargo.write_text(cargo_text.replace(old_tokio, new_tokio))
          PY

      - name: Format exact changed Rust sources
        run: rustfmt --edition 2021 --config skip_children=true src/log_sidecar.rs tests/build_log_sidecar_e2e.rs

      - name: Verify locked graph and focused transport tests
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked log_sidecar::tests:: -- --nocapture
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Remove repair workflow and push reviewed branch result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-den-1862-pipes.yml
          git add src/log_sidecar.rs tests/build_log_sidecar_e2e.rs Cargo.toml .github/workflows/repair-den-1862-pipes.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-1862: apply anonymous-pipe transport repair'
          git push origin HEAD:den-1862-log-sidecar-fanout
