name: rust

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out worker exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out declared source provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/k8s-cluster
          ref: 5cfac43c6900898f36f588d044ca34083da1c726
          path: provenance
          persist-credentials: false
          fetch-depth: 1

      - name: Restore split-repo path dependencies
        run: |
          mkdir -p ../../libs
          cp -a provenance/remote/libs/. ../../libs/

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Unit tests
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check
