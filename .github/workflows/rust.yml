name: rust

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out worker exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust components
        run: rustup component add rustfmt

      - name: Workflow parser unit tests
        run: |
          rm -rf /tmp/gha-worker-workflow-tests
          mkdir -p /tmp/gha-worker-workflow-tests/src
          cp src/workflow.rs /tmp/gha-worker-workflow-tests/src/lib.rs
          cat > /tmp/gha-worker-workflow-tests/Cargo.toml <<'EOF'
          [package]
          name = "gha-worker-workflow-tests"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          EOF
          cargo test --manifest-path /tmp/gha-worker-workflow-tests/Cargo.toml --locked=false

      - name: Compose session unit tests
        run: |
          rm -rf /tmp/gha-worker-compose-tests
          mkdir -p /tmp/gha-worker-compose-tests/src
          cp src/compose_ci.rs /tmp/gha-worker-compose-tests/src/lib.rs
          cat > /tmp/gha-worker-compose-tests/Cargo.toml <<'EOF'
          [package]
          name = "gha-worker-compose-tests"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          tokio = { version = "1", features = ["process", "rt", "macros"] }
          EOF
          cargo test --manifest-path /tmp/gha-worker-compose-tests/Cargo.toml

      - name: Verify split manifest parses
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Report full-crate dependency boundary
        run: |
          if cargo test --all-targets --locked; then
            echo "full crate unit tests passed"
          else
            echo "Full crate tests require the private ORESoftware/k8s-libs-and-shared-defs split dependency tree." >&2
            exit 1
          fi

      - name: Format
        if: always()
        run: cargo fmt --all --check
