name: rust

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out worker exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned shared libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: 84d565eeb7e1e78ce0851a2e3c95966e5cc12e36
          path: libs-provenance
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Restore split-repo path dependencies
        run: |
          mkdir -p ../../libs
          cp -a libs-provenance/. ../../libs/
          rm -rf ../../libs/.git

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Unit tests
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check
