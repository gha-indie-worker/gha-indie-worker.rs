name: Scintilla executor

on:
  pull_request:
    paths:
      - 'src/config.rs'
      - 'src/exec.rs'
      - 'src/http.rs'
      - 'src/jobs.rs'
      - 'src/main.rs'
      - 'src/scintilla_exec.rs'
      - 'src/types.rs'
      - 'src/validation.rs'
      - '.github/workflows/scintilla-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scintilla-executor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --locked --all-targets

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Scintilla boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f src/scintilla_exec.rs
          grep -F '.no_proxy()' src/scintilla_exec.rs
          grep -F 'Policy::none()' src/scintilla_exec.rs
          grep -F 'MAX_RESPONSE_BYTES' src/scintilla_exec.rs
          grep -F 'BUILD_SERVER_SCINTILLA_AUTH_TOKEN' src/scintilla_exec.rs
          grep -F 'reuseWorkspace' src/scintilla_exec.rs
          grep -F 'fencingToken' src/scintilla_exec.rs
          ! grep -REn 'Command::|/bin/sh|bash -c|sh -c' src/scintilla_exec.rs
