name: Secure workflow subset
on:
  pull_request:
    paths: [".github/workflows/secure-workflow-subset.yml", "policy/workflow-subset-v1.json", "tools/validate_job_admission.py"]
  push:
    branches: [main]
    paths: [".github/workflows/secure-workflow-subset.yml", "policy/workflow-subset-v1.json", "tools/validate_job_admission.py"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: python -m json.tool policy/workflow-subset-v1.json >/dev/null
      - run: python tools/validate_job_admission.py --self-test
      - run: python -m py_compile tools/validate_job_admission.py
