name: Source-free four-gate admission canary
on:
  push:
    branches:
      - ci/source-free-four-gate-canary-20261028

permissions:
  contents: read

jobs:
  incident-gate-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise fail-closed four-gate contract
        shell: bash
        run: |
          python3 - <<'PY'
          EXPECTED = (
              (101, 9001, "https://example.invalid/incidents/101"),
              (102, 9002, "https://example.invalid/incidents/102"),
              (103, 9003, "https://example.invalid/incidents/103"),
              (104, 9004, "https://example.invalid/incidents/104"),
          )

          def require_complete(gates, records):
              if tuple(gates) != EXPECTED:
                  raise RuntimeError("gate contract drift")
              if len({n for n, _, _ in gates}) != len(gates):
                  raise RuntimeError("duplicate gate number")
              if len({i for _, i, _ in gates}) != len(gates):
                  raise RuntimeError("duplicate gate id")
              if len({u for _, _, u in gates}) != len(gates):
                  raise RuntimeError("duplicate gate url")
              for number, issue_id, url in gates:
                  item = records[number]
                  if (
                      item.get("id") != issue_id
                      or item.get("number") != number
                      or item.get("html_url") != url
                      or item.get("state") != "closed"
                      or item.get("state_reason") != "completed"
                      or "pull_request" in item
                  ):
                      raise RuntimeError(f"incident {number} not independently completed")

          good = {
              n: {
                  "id": i,
                  "number": n,
                  "html_url": u,
                  "state": "closed",
                  "state_reason": "completed",
              }
              for n, i, u in EXPECTED
          }
          require_complete(EXPECTED, good)

          cases = []
          open_latest = {k: dict(v) for k, v in good.items()}
          open_latest[104]["state"] = "open"
          open_latest[104]["state_reason"] = None
          cases.append((EXPECTED, open_latest))
          wrong_id = {k: dict(v) for k, v in good.items()}
          wrong_id[103]["id"] = 1
          cases.append((EXPECTED, wrong_id))
          wrong_url = {k: dict(v) for k, v in good.items()}
          wrong_url[102]["html_url"] = "https://example.invalid/forged"
          cases.append((EXPECTED, wrong_url))
          pr_object = {k: dict(v) for k, v in good.items()}
          pr_object[101]["pull_request"] = {}
          cases.append((EXPECTED, pr_object))
          cases.append((EXPECTED[:-1], good))
          cases.append((EXPECTED + (EXPECTED[-1],), good))

          for gates, records in cases:
              try:
                  require_complete(gates, records)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("negative case unexpectedly admitted")

          print("SOURCE_FREE_FOUR_GATE_CANARY_PASS")
          PY
