name: Stage canonical GHA indie worker publication

on:
  push:
    branches:
      - agent/publish-yaml-engine-20260804
    paths:
      - '.github/workflows/stage-canonical-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-canonical-gha-indie-worker
  cancel-in-progress: false

jobs:
  stage-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out immutable canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/k8s-cluster
          ref: 42b7471fa680331fe4977db42db8497ab9549cd9
          path: canonical
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize independently buildable publication tree
        shell: bash
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/publication"
          source_root="$GITHUB_WORKSPACE/canonical/remote/deployments/build-server-rs"
          rm -rf "$publication"
          mkdir -p "$publication"
          cp -a "$source_root"/. "$publication"/

          python3 - "$publication/Cargo.toml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          replacements = {
              'dd-telemetry = { path = "../../libs/telemetry-rs" }':
                  'dd-telemetry = { path = "vendor/dd-telemetry" }',
              'dd-nats-subject-defs = { path = "../../libs/nats/subject-defs/generated/rust" }':
                  'dd-nats-subject-defs = { path = "vendor/dd-nats-subject-defs" }',
              'dd-runtime-config-client = { path = "../../libs/runtime-config-client-rs" }':
                  'dd-runtime-config-client = { path = "vendor/dd-runtime-config-client" }',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one dependency declaration: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY

          mkdir -p \
            "$publication/vendor/dd-telemetry/src" \
            "$publication/vendor/dd-nats-subject-defs/src" \
            "$publication/vendor/dd-runtime-config-client/src" \
            "$publication/.github/workflows"

          cat > "$publication/vendor/dd-telemetry/Cargo.toml" <<'EOF'
          [package]
          name = "dd-telemetry"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          tower = "0.5"
          EOF
          cat > "$publication/vendor/dd-telemetry/src/lib.rs" <<'EOF'
          #[derive(Debug, Default)]
          pub struct TelemetryGuard;

          pub fn init(_service_name: &str) -> TelemetryGuard {
              TelemetryGuard
          }

          pub fn http_trace_layer() -> tower::layer::util::Identity {
              tower::layer::util::Identity::new()
          }
          EOF

          cat > "$publication/vendor/dd-nats-subject-defs/Cargo.toml" <<'EOF'
          [package]
          name = "dd-nats-subject-defs"
          version = "0.1.0"
          edition = "2021"
          publish = false
          EOF
          cat > "$publication/vendor/dd-nats-subject-defs/src/lib.rs" <<'EOF'
          pub const BUILD_SERVER_EVENTS_SUBJECT: &str = "dd.remote.build_server.events";
          pub const BUILD_SERVER_RESULTS_SUBJECT: &str = "dd.remote.build_server.results";
          pub const BUILD_SERVER_IMAGES_SUBJECT: &str = "dd.remote.build_server.images";
          pub const BUILD_SERVER_REQUESTS_SUBJECT: &str = "dd.remote.build_server.requests";
          pub const RUNTIME_CRITICAL_EVENTS_SUBJECT: &str = "dd.remote.events.critical";
          pub const DD_REMOTE_BUILD_JOBS_STREAM_NAME: &str = "DD_REMOTE_BUILD_JOBS";
          pub const BUILD_SERVER_REQUESTS_QUEUE_GROUP: &str = "dd-build-server-workers";
          EOF

          cat > "$publication/vendor/dd-runtime-config-client/Cargo.toml" <<'EOF'
          [package]
          name = "dd-runtime-config-client"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          axum = "0.7"
          EOF
          cat > "$publication/vendor/dd-runtime-config-client/src/lib.rs" <<'EOF'
          pub fn router() -> axum::Router {
              axum::Router::new()
          }

          pub async fn register_with_control_plane() {}
          EOF

          python3 - "$publication/Dockerfile" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          marker = 'COPY Cargo.toml Cargo.lock ./\n'
          if source.count(marker) != 1:
              raise SystemExit('Dockerfile dependency-copy boundary drifted')
          source = source.replace(marker, marker + 'COPY vendor ./vendor\n', 1)
          path.write_text(source, encoding='utf-8')
          PY

          cat > "$publication/clippy.toml" <<'EOF'
          # Axum's concrete Response type is intentionally returned by auth
          # helpers so handlers preserve status, headers, and bounded JSON.
          large-error-threshold = 192
          EOF

          cat > "$publication/SOURCE_PROVENANCE.md" <<'EOF'
          # Source provenance

          This repository is published from `ORESoftware/k8s-cluster` at immutable commit `42b7471fa680331fe4977db42db8497ab9549cd9`.

          - Canonical source path: `remote/deployments/build-server-rs`
          - Canonical feature PR: `ORESoftware/k8s-cluster#797`
          - Published role: bounded GitHub Actions YAML planner and fixed-profile execution worker
          - Publication date: 2026-08-04
          - Source parity: `src/`, `scripts/`, `generated/`, and `readme.md` are byte-for-byte canonical
          - Packaging adaptations: three monorepo path dependencies are replaced by local API-compatible crates under `vendor/`; `Dockerfile` copies those crates

          The compatibility crates do not add execution authority: telemetry is an identity layer, runtime registration exposes an empty router and no-op registration in standalone mode, and NATS symbols are the canonical worker subjects, stream name, and queue group.

          This is an independent continuity lane, not a claim to reproduce GitHub's proprietary Actions control plane. Native workflow semantics remain GitHub-hosted Actions and Actions Runner Controller.
          EOF

          cat > "$publication/.github/workflows/ci.yml" <<'EOF'
          name: Standalone GHA indie worker

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: standalone-gha-indie-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}

          jobs:
            rust:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
                  with:
                    toolchain: '1.90.0'
                    components: rustfmt, clippy
                - run: cargo fmt --all -- --check
                - run: cargo clippy --locked --all-targets -- -D warnings
                - run: cargo test --locked --all-targets

            provenance:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    repository: ORESoftware/k8s-cluster
                    ref: 42b7471fa680331fe4977db42db8497ab9549cd9
                    path: canonical
                    persist-credentials: false
                - name: Verify canonical source parity
                  run: |
                    set -euo pipefail
                    source_root=canonical/remote/deployments/build-server-rs
                    diff -ru "$source_root/src" src
                    diff -ru "$source_root/scripts" scripts
                    diff -ru "$source_root/generated" generated
                    cmp "$source_root/readme.md" readme.md
                    grep -F '42b7471fa680331fe4977db42db8497ab9549cd9' SOURCE_PROVENANCE.md
                    test -f vendor/dd-telemetry/src/lib.rs
                    test -f vendor/dd-nats-subject-defs/src/lib.rs
                    test -f vendor/dd-runtime-config-client/src/lib.rs
                - name: Reject credential material
                  run: |
                    if grep -RIE \
                      'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
                      src vendor SOURCE_PROVENANCE.md readme.md; then
                      echo 'credential-like material found' >&2
                      exit 1
                    fi
          EOF

          rm -f "$publication/Cargo.lock"
          printf '%s\n' "$publication" > "$RUNNER_TEMP/publication-path"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy

      - name: Generate lockfile and validate standalone build
        shell: bash
        run: |
          set -euo pipefail
          publication="$(cat "$RUNNER_TEMP/publication-path")"
          cd "$publication"
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          git -C "$GITHUB_WORKSPACE/canonical" diff --no-index --exit-code \
            "$GITHUB_WORKSPACE/canonical/remote/deployments/build-server-rs/src" \
            "$publication/src"

      - name: Archive validated publication tree
        shell: bash
        run: |
          set -euo pipefail
          publication="$(cat "$RUNNER_TEMP/publication-path")"
          tar -C "$publication" -czf "$RUNNER_TEMP/gha-indie-worker-publication.tar.gz" .
          sha256sum "$RUNNER_TEMP/gha-indie-worker-publication.tar.gz" \
            > "$RUNNER_TEMP/gha-indie-worker-publication.tar.gz.sha256"

      - name: Upload validated publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-indie-worker-publication
          path: |
            ${{ runner.temp }}/gha-indie-worker-publication.tar.gz
            ${{ runner.temp }}/gha-indie-worker-publication.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
