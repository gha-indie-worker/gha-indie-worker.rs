version: "0.1"
name: gha-indie-worker-laptop

environment:
  PROJECT_ROOT:
    default: "."
  HOME_DIR:
    default: "${HOME}"
  BUILD_SERVER_WORK_ROOT:
    default: "${HOME_DIR}/.cache/gha-indie-worker/jobs"
  BUILD_SERVER_ALLOWED_REPO_PREFIXES:
    default: "https://github.com/ORESoftware/,https://github.com/gha-indie-worker/,git@github.com:ORESoftware/,git@github.com:gha-indie-worker/"
  BUILD_SERVER_ALLOWED_PROFILE_REPO_PREFIXES:
    default: "https://github.com/ORESoftware/,https://github.com/gha-indie-worker/,git@github.com:ORESoftware/,git@github.com:gha-indie-worker/"
  BUILD_SERVER_GITHUB_WEBHOOK_SECRET:
    required: true
    secret: true
  BUILD_SERVER_AUTH_SECRET:
    required: true
    secret: true
  CLOUDFLARE_TUNNEL_TOKEN:
    required: true
    secret: true

network:
  isolation: session
  backend: auto
  internet: true

services:
  worker:
    runtime: host
    command: ["cargo", "run", "--release"]
    working_dir: "${PROJECT_ROOT}"
    environment:
      HOST: "127.0.0.1"
      PORT: "8100"
      BUILD_SERVER_WORK_ROOT: "${BUILD_SERVER_WORK_ROOT}"
      BUILD_SERVER_GIT_BIN: "git"
      BUILD_SERVER_NERDCTL_BIN: "nerdctl"
      BUILD_SERVER_KUBECTL_BIN: "kubectl"
      BUILD_SERVER_TAR_BIN: "tar"
      BUILD_SERVER_ALLOWED_REPO_PREFIXES: "${BUILD_SERVER_ALLOWED_REPO_PREFIXES}"
      BUILD_SERVER_ALLOWED_PROFILE_REPO_PREFIXES: "${BUILD_SERVER_ALLOWED_PROFILE_REPO_PREFIXES}"
      BUILD_SERVER_GITHUB_WEBHOOK_SECRET: "${BUILD_SERVER_GITHUB_WEBHOOK_SECRET}"
      BUILD_SERVER_AUTH_SECRET: "${BUILD_SERVER_AUTH_SECRET}"
      BUILD_SERVER_WEBHOOK_RULES_PATH: "${PROJECT_ROOT}/examples/laptop/webhook-rules.json"
      BUILD_SERVER_DEPLOY_ENABLED: "false"
      BUILD_SERVER_PUSH_ENABLED: "false"
      BUILD_SERVER_ECR_LOGIN_ENABLED: "false"
      BUILD_SERVER_COORDINATION_ENABLED: "false"
      BUILD_SERVER_NATS_ENABLED: "false"
      BUILD_SERVER_NATS_INTAKE_ENABLED: "false"
      BUILD_SERVER_GH_SYNC_ENABLED: "false"
      BUILD_SERVER_MAX_CONCURRENT_BUILDS: "2"
      BUILD_SERVER_MAX_QUEUED: "16"
    ports:
      - name: http
        target: 8100
        expose: host
        host_port: 8100
    healthcheck:
      test: ["curl", "--fail", "--silent", "http://127.0.0.1:8100/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: on_failure
    stdin_open: true

  cloudflare-tunnel:
    runtime: host
    command: ["cloudflared", "tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      worker:
        condition: service_healthy
        required: true
        restart: true
    restart: unless_stopped
