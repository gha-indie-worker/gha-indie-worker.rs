[package]
name = "litegraph-gpu-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
cuda = []
rocm = []
metal = []
vulkan = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
