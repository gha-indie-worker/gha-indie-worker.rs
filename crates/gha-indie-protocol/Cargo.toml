[package]
name = "gha-indie-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lib]
name = "gha_indie_protocol"
path = "src/lib.rs"

[[bin]]
name = "gha-bind-plan"
path = "src/bin/gha-bind-plan.rs"

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
