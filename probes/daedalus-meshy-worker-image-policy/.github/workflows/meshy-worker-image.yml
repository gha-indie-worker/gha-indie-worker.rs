name: meshy worker image

on:
  pull_request:
    paths:
      - .github/workflows/meshy-worker-image.yml
      - crates/meshy-client/**
      - crates/meshy-job/**
      - crates/meshy-r2-archive/**
      - crates/meshy-worker/**
      - src/job_control.rs
      - scripts/ci/check_meshy_worker_image.py
  push:
    branches: [main]
    paths:
      - .github/workflows/meshy-worker-image.yml
      - crates/meshy-client/**
      - crates/meshy-job/**
      - crates/meshy-r2-archive/**
      - crates/meshy-worker/**
      - src/job_control.rs
      - scripts/ci/check_meshy_worker_image.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meshy-worker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/daedalus-fab/meshy-job-worker
  LOCAL_IMAGE: local/daedalus-meshy-worker:${{ github.sha }}
  EXPECTED_ENTRYPOINT: /usr/local/bin/meshy-job-worker
  EXPECTED_USER: 10001:10001

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Validate publication policy before building
        run: python3 scripts/ci/check_meshy_worker_image.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=daedalus-meshy-job-worker
            org.opencontainers.image.description=Durable review-blocked Meshy image-to-3D worker for Daedalus
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local candidate from the compact resolver artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/meshy-worker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=meshy-worker
          cache-to: type=gha,mode=max,scope=meshy-worker

      - name: Verify local non-root runtime and source contract
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${LOCAL_IMAGE}")" = "${EXPECTED_USER}"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${LOCAL_IMAGE}")" = "${EXPECTED_ENTRYPOINT}"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "${LOCAL_IMAGE}")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${LOCAL_IMAGE}")" = "${SOURCE_SHA}"

      - name: Scan local pull-request candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          scope: daedalus-fab/meshy-job-worker@push

      - name: Publish digest-addressable image with SBOM and provenance
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/meshy-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=meshy-worker
          cache-to: type=gha,mode=max,scope=meshy-worker
          sbom: true
          provenance: mode=max

      - name: Resolve exact published image
        id: exact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Buildx returned an invalid manifest digest" >&2
            exit 1
          fi
          image_ref="${IMAGE}@${DIGEST}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Pull exact published digest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          PUBLISHED_IMAGE: ${{ steps.exact.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker pull "${PUBLISHED_IMAGE}"

      - name: Verify exact published runtime and source contract
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          PUBLISHED_IMAGE: ${{ steps.exact.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "${PUBLISHED_IMAGE}")" = "${EXPECTED_USER}"
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "${PUBLISHED_IMAGE}")" = "${EXPECTED_ENTRYPOINT}"
          test -z "$(docker image inspect --format '{{join .Config.Cmd " "}}' "${PUBLISHED_IMAGE}")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${PUBLISHED_IMAGE}")" = "${SOURCE_SHA}"

      - name: Scan exact published digest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.exact.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Write machine-readable exact-digest evidence
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_REF: ${{ steps.exact.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/meshy-worker-image-evidence"
          mkdir -p "${evidence_dir}"
          jq -n \
            --arg digest "${DIGEST}" \
            --arg image "${IMAGE}" \
            --arg image_ref "${IMAGE_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{
              schema_version: 2,
              repository: $repository,
              source_sha: $source_sha,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              target: "meshy-worker",
              image: $image,
              digest: $digest,
              image_ref: $image_ref,
              exact_digest_pulled: true,
              exact_runtime_contract_verified: true,
              exact_digest_vulnerability_scan: "passed",
              provider_credentials_used: false,
              live_meshy_task_submitted: false,
              fabrication_release_authorized: false
            }' >"${evidence_dir}/meshy-worker.json"
          jq -e '
            .schema_version == 2 and
            (.source_sha | test("^[0-9a-f]{40}$")) and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            .image_ref == (.image + "@" + .digest) and
            .exact_digest_pulled == true and
            .exact_runtime_contract_verified == true and
            .exact_digest_vulnerability_scan == "passed" and
            .provider_credentials_used == false and
            .live_meshy_task_submitted == false and
            .fabrication_release_authorized == false
          ' "${evidence_dir}/meshy-worker.json"

      - name: Upload machine-readable exact-digest evidence
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshy-worker-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meshy-worker-image-evidence/meshy-worker.json
          if-no-files-found: error
          retention-days: 90

      - name: Record exact published digest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          {
            echo '### Daedalus Meshy worker'
            echo
            echo "\`${{ steps.exact.outputs.image_ref }}\`"
            echo
            echo "Evidence artifact: \`meshy-worker-digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo 'The exact published digest was pulled, runtime-inspected, and vulnerability-scanned. No Meshy or R2 credential is used by this workflow.'
          } >> "${GITHUB_STEP_SUMMARY}"
