[package]
name = "dd-meshy-r2-archive"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
aws-config = { version = "=1.10.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "=1.140.0"
base64 = "0.22"
dd-meshy-job = { path = "../meshy-job" }
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"
